<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>KuArte · Design feed (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d01-home.dc.html">KUARTE</a>
    <nav class="dnav grow" aria-label="Main"><a href="d01-home.dc.html">Explore</a><a class="on" href="d04-designs.dc.html">Designs</a><a href="d12-status.dc.html">My bookings</a><a href="d15-chat.dc.html">Messages</a></nav>
    <a class="lnk" href="d16-signup.dc.html">For nail techs</a>
    <span class="av s">MS</span>
  </div></header>
  <div class="dwrap" style="gap: 24px">
    <div class="row between" style="flex-wrap: wrap; gap: 16px; align-items: flex-end">
      <div class="col" style="gap: 6px"><h1 class="dtitle">Book by design</h1><p class="sm">Every photo here came from a completed KuArte booking. Pick a look, then book the tech who made it.</p></div>
      <span class="row sm" style="gap: 6px">Near <b class="strong">Gredu, Panabo</b></span>
    </div>
    <div class="wrap-row">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="7"><button class="chip {{c.cls}}" onClick="{{c.pick}}">{{c.name}}</button></sc-for>
    </div>
    <div class="dgrid" style="grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
        <a href="d05-design-detail.dc.html" class="col" style="gap: 8px; text-decoration: none">
          <div class="ph" style="height: 260px; border-radius: 18px"><img src="{{t.img}}" alt="{{t.name}}"><span class="ver"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>Verified</span><span class="fav"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span></div>
          <div class="row between"><span class="sm strong">{{t.name}}</span><span class="sm">from <b class="price">₱{{t.price}}</b></span></div>
          <span class="cap">{{t.tech}} · {{t.dist}}</span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'All' }; }
  renderVals() {
    const B = './assets/';
    const T = [
      { name: 'Burgundy chrome', tag: 'Chrome', tech: 'Viper Cullen', dist: '1.2 km', price: 450, img: B + 'n1-burgundy-chrome.svg' },
      { name: 'Gold leaf nude', tag: 'Gold leaf', tech: 'Viper Cullen', dist: '1.2 km', price: 420, img: B + 'n2-gold-leaf.svg' },
      { name: 'Classic French', tag: 'French tip', tech: 'Reyna Nail Studio', dist: '3.1 km', price: 300, img: B + 'n3-classic-french.svg' },
      { name: 'Milky dots', tag: 'Minimal', tech: 'Reyna Nail Studio', dist: '3.1 km', price: 350, img: B + 'n4-milky-dots.svg' },
      { name: 'Autumn florals', tag: 'Florals', tech: 'Viper Cullen', dist: '1.2 km', price: 500, img: B + 'n5-autumn-florals.svg' },
      { name: 'Emerald cat-eye', tag: 'Cat-eye', tech: 'Killjoy Nails', dist: '2.4 km', price: 420, img: B + 'n6-emerald-cateye.svg' },
      { name: 'Noir and gold', tag: 'Chrome', tech: 'Killjoy Nails', dist: '2.4 km', price: 400, img: B + 'n7-noir-gold.svg' },
      { name: 'Pastel mix', tag: 'Minimal', tech: 'Lumi Nails by Kat', dist: '3.8 km', price: 320, img: B + 'n8-pastel-mix.svg' }
    ];
    const C = ['All', 'Chrome', 'French tip', 'Gold leaf', 'Florals', 'Cat-eye', 'Minimal'];
    const f = this.state.f;
    return {
      chips: C.map((n) => ({ name: n, cls: f === n ? 'on' : '', pick: () => this.setState({ f: n }) })),
      tiles: f === 'All' ? T : T.filter((t) => t.tag === f)
    };
  }
}
</script>
</body>
</html>
