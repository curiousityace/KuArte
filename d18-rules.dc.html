<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<script src="./shared.js" defer></script>
<title>KuArte for techs · Booking rules (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d16-signup.dc.html" aria-label="KuArte home"><img class="logo" src="./assets/photos/logo-h.png" alt="KuArte"></a><span class="badge">For nail techs</span>
    <span class="grow"></span>
    <span class="cap">Setting up · saved automatically</span>
  </div></header>
  <div class="dwrap">
    <div class="dsplit">
      <aside class="dside" style="flex: 1 1 240px; max-width: 280px">
        <div class="tint" style="padding: 18px; display: flex; flex-direction: column; gap: 12px">
          <span class="lbl">Go live checklist</span>
          <div class="bar" style="background: #FFFFFF"><i style="width: 60%"></i></div>
          <span class="row sm" style="gap: 10px"><span class="check on"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span>Account</span>
          <a class="row sm" href="d17-setup.dc.html" style="gap: 10px; text-decoration: none"><span class="check on"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span>Profile and services</a>
          <span class="row sm strong wine" style="gap: 10px"><span class="radio on"></span>Booking rules</span>
          <a class="row sm" href="d19-camera.dc.html" style="gap: 10px; text-decoration: none"><span class="radio"></span>3 portfolio photos</a>
          <a class="row sm" href="d20-availability.dc.html" style="gap: 10px; text-decoration: none"><span class="radio"></span>Hours</a>
        </div>
      </aside>
      <div class="dmain" style="gap: 24px; max-width: 760px">
        <div class="col" style="gap: 4px"><h1 class="dtitle">Booking rules</h1><p class="sm">You can change these any time from your profile.</p></div>
        <div class="card pad-l" style="display: flex; flex-direction: column; gap: 14px">
          <div class="row between"><div class="col" style="gap: 2px"><span class="ttl" style="font-size: 15px">Ask for a deposit</span><span class="cap">{{depSub}}</span></div><button class="tog {{depOn}}" type="button" role="switch" aria-checked="{{depAria}}" onClick="{{toggleDep}}" aria-label="Ask for a deposit"></button></div>
          <div class="reveal {{depOpen}}" aria-hidden="{{depHidden}}"><div><div class="seg sl" role="radiogroup" aria-label="Deposit amount" style="--n: 3; --i: {{amtI}}; max-width: 360px; margin-top: 2px"><sc-for list="{{amts}}" as="a" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{a.checked}}" class="{{a.cls}}" onClick="{{a.pick}}" tabindex="{{a.tab}}">{{a.name}}</button></sc-for></div><span class="cap" style="display: block; margin-top: 8px">{{amtNote}}</span></div></div>
        </div>
        <div class="col" style="gap: 10px">
          <span class="lbl">Cancellation policy</span>
          <div class="dgrid" style="gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))">
            <sc-for list="{{policies}}" as="p" hint-placeholder-count="3">
              <button class="opt {{p.cls}}" onClick="{{p.pick}}" style="flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font-family: 'DM Sans', system-ui, sans-serif">
                <span class="row" style="gap: 8px"><span class="radio {{p.cls}}"></span><span class="sm strong">{{p.name}}</span></span>
                <span class="cap">{{p.desc}}</span>
              </button>
            </sc-for>
          </div>
        </div>
        <div class="dgrid l" style="gap: 20px">
          <div class="col" style="gap: 10px"><span class="lbl">Reply to requests within</span><div class="seg sl" role="radiogroup" aria-label="Reply to requests within" style="--n: 3; --i: {{repI}}"><sc-for list="{{reps}}" as="r" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{r.checked}}" class="{{r.cls}}" onClick="{{r.pick}}">{{r.name}}</button></sc-for></div><span class="cap">Requests you don't answer within {{repLabel}} expire and the customer is refunded.</span></div>
          <div class="card" style="display: flex; gap: 12px; padding: 14px 16px; align-items: center"><span style="width: 40px; height: 40px; border-radius: 10px; background: #2F5FB3; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></svg></span><div class="col grow" style="gap: 1px"><span class="sm strong">Payouts to GCash</span><span class="cap">Account ending 0187</span></div><button class="lnk" type="button" data-soon="Payout settings" data-msg="Changing your payout account is coming soon." style="border: 0; background: none; cursor: pointer">Change</button></div>
        </div>
        <p class="cap">KuArte keeps 10% of the final price on bookings made here, taken from your payout. Your first month is commission-free.</p>
        <div class="row" style="gap: 12px"><a class="btn bp" href="d19-camera.dc.html">Next: add portfolio photos</a><a class="btn bg" href="d17-setup.dc.html">Back</a></div>
      </div>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { dep: true, pol: 1, amt: 1, rep: 1 }; }
  renderVals() {
    const P = [
      { name: 'Flexible', desc: 'Free to cancel up to 2 hours before' },
      { name: 'Moderate', desc: 'Free up to 24 hours before, then 50% of the deposit back' },
      { name: 'Strict', desc: 'Free up to 48 hours before, then no refund' }
    ];
    const A = ['₱100', '₱150', '30%'], R = ['1 hr', '4 hr', '12 hr'], st = this.state;
    return {
      dep: st.dep, depOn: st.dep ? 'on' : '', depOpen: st.dep ? 'open' : '', depHidden: st.dep ? 'false' : 'true', depAria: st.dep ? 'true' : 'false',
      depSub: st.dep ? 'Paid through KuArte, sent to you after the visit' : 'Off · customers book without paying first',
      toggleDep: () => this.setState({ dep: !st.dep }),
      amtI: st.amt, amts: A.map((n, i) => ({ name: n, cls: st.amt === i ? 'on' : '', checked: st.amt === i ? 'true' : 'false', tab: st.dep ? '0' : '-1', pick: () => this.setState({ amt: i }) })),
      amtNote: 'Customers pay ' + (st.amt === 2 ? '30% of the starting price' : A[st.amt]) + ' to hold a slot. Refunded in full if you cancel or don\'t show.',
      repI: st.rep, repLabel: R[st.rep], reps: R.map((n, i) => ({ name: n, cls: st.rep === i ? 'on' : '', checked: st.rep === i ? 'true' : 'false', pick: () => this.setState({ rep: i }) })),
      policies: P.map((p, i) => ({ ...p, cls: this.state.pol === i ? 'on' : '', pick: () => this.setState({ pol: i }) }))
    };
  }
}
</script>
</body>
</html>
