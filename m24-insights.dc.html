<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<title>KuArte for techs · Insights</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="scr">
  <div class="top" style="padding-bottom: 8px">
    <div class="col grow" style="gap: 0"><h1 class="h1">Insights</h1><span class="cap">{{cur.sub}} · sample data</span></div>
  </div>
  <div style="padding: 0 20px 12px"><div class="seg sl" role="radiogroup" aria-label="Period" style="--n: 3; --i: {{perI}}; width: 100%"><sc-for list="{{pers}}" as="p" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{p.checked}}" class="{{p.cls}}" onClick="{{p.pick}}">{{p.name}}</button></sc-for></div></div>
  <div class="scroll" style="gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div class="card" style="padding: 14px"><span class="cap">Profile views</span><p style="font: 700 24px/1.2 'DM Sans', system-ui, sans-serif; margin-top: 4px">{{cur.views}}</p></div>
      <div class="card" style="padding: 14px"><span class="cap">Bookings</span><p style="font: 700 24px/1.2 'DM Sans', system-ui, sans-serif; margin-top: 4px">{{cur.book}}</p></div>
      <div class="card" style="padding: 14px"><span class="cap">Booked again</span><p style="font: 700 24px/1.2 'DM Sans', system-ui, sans-serif; margin-top: 4px">{{cur.again}}</p></div>
      <div class="card" style="padding: 14px"><span class="cap">Matched reference</span><p style="font: 700 24px/1.2 'DM Sans', system-ui, sans-serif; margin-top: 4px">{{cur.match}}</p></div>
    </div>
    <div class="card pad" style="display: flex; flex-direction: column; gap: 10px">
      <div class="row between"><span class="sm strong">{{cur.title}}</span><span class="cap">{{cur.range}} · tap a bar</span></div>
      <div class="bars" role="group" aria-label="{{chartAria}}"><sc-for list="{{bars}}" as="x" hint-placeholder-count="6"><button type="button" class="b {{x.cls}}" style="--f: {{x.f}}" aria-label="{{x.aria}}" onClick="{{x.pick}}"><span class="tip">{{x.n}} {{x.unit}}</span><span class="fill"></span><span class="d">{{x.d}}</span></button></sc-for></div>
    </div>
    <div class="col" style="gap: 8px">
      <span class="lbl">Badges</span>
      <div class="wrap-row" style="gap: 6px"><span class="badge gold">Top Rated</span><span class="badge">Verified Work</span><span class="badge">Reliable</span><span class="badge">Repeat Favorite</span></div>
    </div>
    <div style="padding: 16px; border-radius: 18px; background: #3B0D13; color: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
      <div class="row" style="gap: 8px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true" style="color: #E7C27A"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span class="lbl" style="color: #E7C27A">Boost</span></div>
      <p style="font: 600 18px/1.25 'Playfair Display', serif">Show up first in Panabo searches for {{boostDays}}</p>
      <div class="seg sl dark" role="radiogroup" aria-label="Boost length" style="--n: 2; --i: {{boostI}}"><sc-for list="{{boosts}}" as="b" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{b.checked}}" class="{{b.cls}}" onClick="{{b.pick}}">{{b.name}}</button></sc-for></div>
      <p style="font-size: 12px; color: #E9D3D5">Boosted spots are labeled Sponsored. Your rating still shows as-is.</p>
      <button class="btn bgold">Boost for [BOOST PRICE]</button>
    </div>
  </div>
  <nav class="nav" aria-label="Tech">
    <a href="m22-dashboard.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bookings</a>
    <a href="m21-request.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Requests<span class="dot"></span></a>
    <a href="m19-camera.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Portfolio</a>
    <a class="on" href="m24-insights.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Insights</a>
    <a href="m17-setup.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { per: 1, boost: 0, tip: -1 }; }
  renderVals() {
    const P = [
      { label: 'Week', sub: 'Oct 27 – Nov 2', views: '310', book: '13', again: '41%', match: '94%', title: 'Bookings per day', range: 'This week', bars: [['Mon', 1], ['Tue', 2], ['Wed', 3], ['Thu', 1], ['Fri', 2], ['Sat', 3], ['Sun', 1]] },
      { label: 'Month', sub: 'October 2026', views: '1,240', book: '46', again: '38%', match: '92%', title: 'Bookings per week', range: 'Last 6 weeks', bars: [['Sep 22', 6], ['Sep 29', 8], ['Oct 6', 7], ['Oct 13', 10], ['Oct 20', 11], ['Oct 27', 13]] },
      { label: 'Year', sub: '2026 so far', views: '9,860', book: '312', again: '35%', match: '91%', title: 'Bookings per month', range: 'Jan – Oct', bars: [['Jan', 15], ['Feb', 19], ['Mar', 23], ['Apr', 26], ['May', 29], ['Jun', 32], ['Jul', 36], ['Aug', 41], ['Sep', 45], ['Oct', 46]] }
    ];
    const st = this.state, cur = P[st.per];
    const max = Math.max.apply(null, cur.bars.map((b) => b[1]));
    const D = ['3 days', '7 days'];
    return {
      perI: st.per, cur,
      pers: P.map((p, i) => ({ name: p.label, cls: st.per === i ? 'on' : '', checked: st.per === i ? 'true' : 'false', pick: () => this.setState({ per: i, tip: -1 }) })),
      bars: cur.bars.map((b, i) => ({ d: b[0], n: b[1], unit: b[1] === 1 ? 'booking' : 'bookings', f: (b[1] / max).toFixed(3), cls: (i === cur.bars.length - 1 ? 'on' : '') + (st.tip === i ? ' show' : ''), pick: () => this.setState({ tip: st.tip === i ? -1 : i }), aria: b[0] + ': ' + b[1] + (b[1] === 1 ? ' booking' : ' bookings') })),
      chartAria: cur.title + ': ' + cur.bars.map((b) => b[0] + ' ' + b[1]).join(', '),
      boostI: st.boost, boostDays: D[st.boost],
      boosts: D.map((n, i) => ({ name: n, cls: st.boost === i ? 'on' : '', checked: st.boost === i ? 'true' : 'false', pick: () => this.setState({ boost: i }) }))
    };
  }
}
</script>
</body>
</html>
