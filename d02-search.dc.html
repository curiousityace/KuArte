<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>KuArte · Search (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d01-home.dc.html">KUARTE</a>
    <form class="search" action="d02-search.dc.html" method="get" role="search" style="max-width: 520px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" name="q" value="{{q}}" placeholder="Search techs, designs, services" aria-label="Search" autocomplete="off"><span class="cap" style="white-space: nowrap">near Gredu, Panabo</span></form>
    <nav class="dnav grow" aria-label="Main"><a class="on" href="d01-home.dc.html">Explore</a><a href="d04-designs.dc.html">Designs</a><a href="d12-status.dc.html">My bookings</a><a href="d15-chat.dc.html">Messages</a></nav>
    <span class="av s">MS</span>
  </div></header>
  <div class="dwrap" style="gap: 20px; padding-top: 24px">
    <div class="row between" style="flex-wrap: wrap; gap: 12px">
      <div class="wrap-row">
        <a class="chip" href="d03-filters.dc.html"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>All filters</a>
        <span class="chip on">Gel extensions</span><span class="chip">Walk-in</span><span class="chip">Home service</span><span class="chip on">Open today</span><span class="chip">4.5+</span>
      </div>
      <span class="row sm" style="gap: 6px">Sort by <b class="strong">Nearest</b><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
    </div>
    <div class="dsplit" style="gap: 24px">
      <div class="dmain" style="gap: 12px; flex-basis: 520px">
        <p class="sm"><b class="strong">12 verified techs</b> within 5 km</p>
        <sc-for list="{{techs}}" as="t" hint-placeholder-count="5">
          <a class="card" href="d06-profile.dc.html" style="display: flex; gap: 16px; padding: 14px; text-decoration: none; box-shadow: {{t.ring}}">
            <div class="ph" style="width: 120px; height: 120px"><img src="{{t.img}}" alt="{{t.alt}}"><span class="ver"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>Verified</span></div>
            <div class="col grow" style="gap: 5px">
              <div class="row between" style="align-items: flex-start"><span class="ttl">{{t.name}}</span><span class="sm">from <b class="price">₱{{t.price}}</b></span></div>
              <span class="row cap" style="gap: 4px"><svg class="i xs f" viewBox="0 0 24 24" style="color: #C49A45" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><b class="strong">{{t.rating}}</b> ({{t.count}}) · {{t.dist}} · {{t.area}}</span>
              <span class="cap">{{t.modes}}</span>
              <span class="cap">Next open: <b class="strong">{{t.next}}</b></span>
              <div class="wrap-row" style="gap: 4px; margin-top: auto"><span class="badge {{t.bcls}}">{{t.badge}}</span></div>
            </div>
          </a>
        </sc-for>
      </div>
      <div class="dside w" style="flex-basis: 480px">
        <div class="map" style="height: 680px">
          <div class="water" style="left: -60px; top: 470px; width: 760px; height: 260px; transform: rotate(-8deg)"></div>
          <div class="road" style="left: 0; top: 240px; width: 100%; height: 12px"></div>
          <div class="road" style="left: 260px; top: 0; width: 12px; height: 100%"></div>
          <div class="road" style="left: 0; top: 90px; width: 100%; height: 8px; transform: rotate(12deg)"></div>
          <div class="road" style="left: 440px; top: 0; width: 8px; height: 100%"></div>
          <div class="blk" style="left: 40px; top: 290px; width: 170px; height: 100px"></div>
          <div class="blk" style="left: 300px; top: 280px; width: 110px; height: 80px"></div>
          <div class="blk" style="left: 310px; top: 130px; width: 100px; height: 70px"></div>
          <span class="me" style="left: 266px; top: 246px"></span>
          <a class="pin on" href="d06-profile.dc.html" style="left: 120px; top: 170px; text-decoration: none">₱350 · Viper</a>
          <span class="pin" style="left: 330px; top: 70px">₱300</span>
          <span class="pin" style="left: 380px; top: 380px">₱280</span>
          <span class="pin" style="left: 80px; top: 430px">₱320</span>
          <span class="pin" style="left: 470px; top: 220px">₱450</span>
          <span class="cap" style="position: absolute; right: 12px; bottom: 10px">Map preview</span>
        </div>
      </div>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const B = './assets/';
    const q = (() => { try { return new URLSearchParams(location.search).get('q'); } catch (e) { return null; } })();
    return {
      q: q || 'Gel extensions',
      techs: [
        { name: 'Viper Cullen Nail Studio', price: 350, rating: '4.9', count: 38, dist: '1.2 km', area: 'Gredu', modes: 'Walk-in · Home service', next: 'Today, 2:30 PM', badge: 'Top Rated', bcls: 'gold', img: B + 'n5-autumn-florals.svg', alt: 'Autumn florals by Viper Cullen', ring: 'inset 0 0 0 1.5px #5E1720' },
        { name: 'Killjoy Nails', price: 300, rating: '4.8', count: 21, dist: '2.4 km', area: 'New Visayas', modes: 'Home service only', next: 'Tomorrow, 10:00 AM', badge: 'Reliable', bcls: '', img: B + 'n6-emerald-cateye.svg', alt: 'Emerald cat-eye by Killjoy Nails', ring: 'none' },
        { name: 'Reyna Nail Studio', price: 280, rating: '4.7', count: 16, dist: '3.1 km', area: 'Sto. Niño', modes: 'Walk-in', next: 'Today, 5:00 PM', badge: 'Verified Work', bcls: '', img: B + 'n3-classic-french.svg', alt: 'Classic French by Reyna Nail Studio', ring: 'none' },
        { name: 'Lumi Nails by Kat', price: 320, rating: '5.0', count: 4, dist: '3.8 km', area: 'Cagangohan', modes: 'Walk-in · Home service', next: 'Sat, 9:00 AM', badge: 'New on KuArte', bcls: 'new', img: B + 'n8-pastel-mix.svg', alt: 'Pastel mix by Lumi Nails', ring: 'none' }
      ]
    };
  }
}
</script>
</body>
</html>
