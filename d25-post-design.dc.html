<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<script src="./shared.js" defer></script>
<title>KuArte · Post a design (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d01-home.dc.html" aria-label="KuArte home"><img class="logo" src="./assets/photos/logo-h.png" alt="KuArte"></a>
    <nav class="dnav grow" aria-label="Main"><a href="d01-home.dc.html">Explore</a><a class="on" href="d04-designs.dc.html">Designs</a><a href="d12-status.dc.html">My bookings</a><a href="d15-chat.dc.html">Messages</a></nav>
    <a class="av s" href="login.html" aria-label="Log in or switch account" style="text-decoration: none">MS</a>
  </div></header>
  <div class="dwrap" style="max-width: 1120px">
    <div class="col" style="gap: 6px">
      <a class="lnk row" href="d01-home.dc.html" style="gap: 4px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back to explore</a>
      <h1 class="dtitle">Post a design</h1>
      <p class="sm">Show the look you want. Nearby Nail Technicians send offers with a fixed price and times they can do.</p>
    </div>
    <div class="dsplit">
      <div class="dmain" style="gap: 22px; max-width: 640px">
        <div class="card" style="display: flex; gap: 16px; padding: 14px; align-items: center">
          <div class="ph" style="width: 96px; height: 96px; border-radius: 14px"><img src="./assets/photos/black-cherry.jpg" alt="Your design: black nails with gold lines"></div>
          <div class="col grow" style="gap: 2px"><span class="ttl" style="font-size: 15px">Noir and gold</span><span class="cap">From your saved designs</span></div>
          <a class="btn sm bg" href="d04-designs.dc.html">Change photo</a>
        </div>
        <div class="dgrid l" style="gap: 20px">
          <div class="col" style="gap: 8px"><span class="lbl">Service</span><div class="seg"><sc-for list="{{svc}}" as="o" hint-placeholder-count="3"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></div></div>
          <div class="col" style="gap: 8px"><span class="lbl">Length</span><div class="seg"><sc-for list="{{len}}" as="o" hint-placeholder-count="3"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></div></div>
          <div class="col" style="gap: 8px"><span class="lbl">Shape</span><div class="wrap-row"><sc-for list="{{shape}}" as="o" hint-placeholder-count="4"><button class="chip {{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></div></div>
          <div class="col" style="gap: 8px"><span class="lbl">Where</span><div class="seg"><sc-for list="{{mode}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></div></div>
          <div class="col" style="gap: 8px"><span class="lbl">When</span><div class="wrap-row"><sc-for list="{{when}}" as="o" hint-placeholder-count="3"><button class="chip {{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></div></div>
          <div class="col" style="gap: 8px"><span class="lbl">Budget (optional)</span><div class="wrap-row"><sc-for list="{{budget}}" as="o" hint-placeholder-count="4"><button class="chip {{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></div></div>
        </div>
        <div class="field"><label for="dpd-note">Note for Nail Technicians (optional)</label><textarea id="dpd-note" class="inp">Matte black with thin gold lines, like the photo. No glitter please.</textarea></div>
      </div>
      <aside class="dside">
        <div class="card pad-l shadow" style="display: flex; flex-direction: column; gap: 14px">
          <span class="lbl">What Nail Technicians will see</span>
          <div class="ph" style="height: 200px; border-radius: 14px"><img src="./assets/photos/black-cherry.jpg" alt=""></div>
          <span class="ttl">Noir and gold</span>
          <span class="sm">{{summary}}</span>
          <span class="cap">Your name and address stay hidden until you accept an offer.</span>
          <div class="hr"></div>
          <div class="row" style="gap: 8px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true" style="color: #2F7A4E"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="cap">Requests like this usually get 3–5 offers within 2 hours</span></div>
          <a class="btn bp full" href="d26-offers.dc.html?toast=Request%20posted.%20Offers%20usually%20arrive%20within%202%20hours.">Post to Nail Technicians within 15 km</a>
        </div>
      </aside>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { svc: 0, shape: 1, len: 1, mode: 0, when: 0, budget: 1 }; }
  renderVals() {
    const st = this.state;
    const L = {
      svc: ['Gel extensions', 'Gel manicure', 'Acrylic'], shape: ['Square', 'Almond', 'Oval', 'Coffin'], len: ['Short', 'Medium', 'Long'],
      mode: ['Walk-in', 'Home service'], when: ['This weekend', 'Next week', 'Pick dates'], budget: ['Up to ₱400', '₱400–600', '₱600+', 'No limit']
    };
    const group = (key) => L[key].map((name, i) => ({ name, cls: st[key] === i ? 'on' : '', pick: () => this.setState({ [key]: i }) }));
    return {
      svc: group('svc'), shape: group('shape'), len: group('len'), mode: group('mode'), when: group('when'), budget: group('budget'),
      summary: [L.svc[st.svc], L.shape[st.shape] + ', ' + L.len[st.len].toLowerCase(), L.when[st.when], L.mode[st.mode], L.budget[st.budget]].join(' · ')
    };
  }
}
</script>
</body>
</html>
