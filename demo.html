<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KuArte · Live demo</title>
<meta name="theme-color" content="#3B0D13">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./kuarte.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #3B0D13; color: #F6ECED; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  .dbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 24px; border-bottom: 1px solid rgba(255,255,255,.1); flex: none; }
  .dbar h1 { font: 600 20px/1.2 'Playfair Display', serif; margin: 0; color: #FFFFFF; }
  .dbar .grow { flex: 1; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.08); }
  .tabs button { border: 0; background: transparent; color: #E9D3D5; font: 600 13px 'DM Sans', sans-serif; padding: 8px 14px; border-radius: 9px; cursor: pointer; transition: background-color 150ms ease, color 150ms ease, transform 160ms cubic-bezier(.23,1,.32,1); }
  .tabs button.on { background: #FFFFFF; color: #5E1720; }
  .tabs button:active, .ghost:active { transform: scale(.97); }
  .ghost { border: 1px solid rgba(255,255,255,.25); background: transparent; color: #FFFFFF; font: 600 13px 'DM Sans', sans-serif; padding: 8px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; transition: background-color 150ms ease, transform 160ms cubic-bezier(.23,1,.32,1); }
  @media (hover: hover) and (pointer: fine) { .ghost:hover { background: rgba(255,255,255,.1); } .tabs button:not(.on):hover { color: #FFFFFF; } }
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 20px 24px 0; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: #FFFFFF; }
  .who span { font-weight: 500; color: #C9A2A6; }
  .phone { flex: none; width: 390px; height: 844px; border-radius: 40px; overflow: hidden; background: #FCF8F7; box-shadow: 0 0 0 8px #22161A, 0 30px 80px rgba(0,0,0,.45); transform-origin: top center; }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .guide { width: 260px; flex: none; display: flex; flex-direction: column; gap: 14px; padding-top: 34px; }
  .guide h2 { font: 600 16px/1.3 'Playfair Display', serif; color: #FFFFFF; margin: 0; }
  .guide ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.45; color: #E9D3D5; }
  .guide b { color: #FFFFFF; }
  .guide .note { font-size: 12px; color: #C9A2A6; line-height: 1.45; }
  .small { display: none; padding: 32px 24px; text-align: center; font-size: 15px; line-height: 1.5; }
  .small a { color: #E7C27A; font-weight: 700; }
  @media (max-width: 899px) { .stage, .dbar .tabs, #reset { display: none; } .small { display: block; } body { overflow: auto; } }
  @media (max-width: 1199px) { .guide { display: none; } }
</style>
</head>
<body>
  <header class="dbar">
    <a href="./index.html" aria-label="KuArte, all screens"><img src="./assets/photos/logo-h-light.png" alt="KuArte" style="height: 36px; width: auto; display: block"></a>
    <h1>Live demo: both sides at once</h1>
    <span class="grow"></span>
    <div class="tabs" role="tablist" aria-label="Scenario">
      <button class="on" data-s="booking" role="tab" aria-selected="true">Booking request</button>
      <button data-s="design" role="tab" aria-selected="false">Post a design</button>
      <button data-s="checkin" role="tab" aria-selected="false">Check-in</button>
      <button data-s="chat" role="tab" aria-selected="false">Chat</button>
    </div>
    <button class="ghost" id="reset">Reset demo</button>
    <a class="ghost" href="./index.html">All screens</a>
  </header>

  <main class="stage" id="stage">
    <section class="side" aria-label="Customer phone">
      <div class="who">Customer <span id="who-c">Maria, booking a set</span></div>
      <div class="phone" id="pc"><iframe id="fc" title="Customer app" src="./home.html"></iframe></div>
    </section>
    <section class="side" aria-label="Nail Technician phone">
      <div class="who">Nail Technician <span>Viper Cullen Nail Studio</span></div>
      <div class="phone" id="pt"><iframe id="ft" title="Nail Technician app" src="./m22-dashboard.dc.html"></iframe></div>
    </section>
    <aside class="guide" id="guide"></aside>
  </main>

  <p class="small">The live demo shows the customer and Nail Technician phones side by side, so it needs a laptop or a wider window.<br><a href="./index.html">Open the screens one at a time instead</a></p>

<script>
(function () {
  var GUIDES = {
    booking: {
      c: './home.html', t: './m22-dashboard.dc.html', who: 'Maria, booking a set',
      html: '<h2>Booking request</h2><ol>' +
        '<li><b>Customer:</b> tap Viper\'s card, then Book appointment. Pick a service, a time, type a name, and pay the deposit.</li>' +
        '<li><b>Tech:</b> the request appears on Viper\'s dashboard. Open it and tap Accept.</li>' +
        '<li><b>Customer:</b> the booking turns to "Your turn". Tap Confirm booking.</li>' +
        '<li><b>Tech:</b> it moves to Upcoming as Confirmed.</li></ol>' +
        '<p class="note">Try Decline on the Nail Technician side, or Cancel on the customer side, to show refunds.</p>'
    },
    design: {
      c: './m25-post-design.dc.html', t: './m27-design-requests.dc.html', who: 'Maria, posting a design',
      html: '<h2>Post a design</h2><ol>' +
        '<li><b>Customer:</b> set the details and post the request.</li>' +
        '<li><b>Tech:</b> open "Noir and gold", set a quote and times, pick sample photos, and send the offer.</li>' +
        '<li><b>Customer:</b> Viper\'s offer now shows that quote. Pick one of the times and accept.</li>' +
        '<li><b>Tech:</b> My offers shows Chosen, and the booking is in Upcoming.</li></ol>' +
        '<p class="note">Offers from other Nail Technicians are sample data.</p>'
    },
    checkin: {
      c: './m13-checkin.dc.html', t: './m22-dashboard.dc.html', who: 'Maria, on the day',
      html: '<h2>Check-in</h2><ol>' +
        '<li><b>Customer:</b> tap On my way. Viper\'s Upcoming list shows "Customer on the way".</li>' +
        '<li><b>Customer:</b> tap 10 min under "Running late?". It goes to Viper as a chat message and shows on the booking.</li>' +
        '<li><b>Customer:</b> tap I\'m here. Viper sees "Customer arrived".</li>' +
        '<li><b>Tech:</b> tap the bell to see every update in one list.</li></ol>' +
        '<p class="note">If nobody checks in 15 minutes after the start time, these records decide the no-show refund.</p>'
    },
    chat: {
      c: './chat.html', t: './chat.html?as=tech', who: 'Maria, chatting with Viper',
      html: '<h2>Chat</h2><ol>' +
        '<li><b>Customer:</b> type a message and send it.</li>' +
        '<li><b>Tech:</b> it appears on Viper\'s phone straight away. Type a reply.</li>' +
        '<li><b>Customer:</b> the reply shows up live.</li>' +
        '<li>Try sending a phone number: both sides get a reminder to keep the chat in KuArte.</li></ol>' +
        '<p class="note">Messages stay in this browser. Reset demo clears them.</p>'
    }
  };
  var fc = document.getElementById('fc'), ft = document.getElementById('ft'), guide = document.getElementById('guide');
  function load(s) {
    var g = GUIDES[s];
    fc.src = g.c; ft.src = g.t; guide.innerHTML = g.html;
    document.getElementById('who-c').textContent = g.who;
    document.querySelectorAll('.tabs button').forEach(function (b) { var on = b.getAttribute('data-s') === s; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
  }
  function reset() {
    try { Object.keys(localStorage).filter(function (k) { return k.indexOf('kuarte.') === 0; }).forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
  }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { reset(); load(b.getAttribute('data-s')); }); });
  document.getElementById('reset').addEventListener('click', function () { reset(); load(document.querySelector('.tabs button.on').getAttribute('data-s')); });
  function fit() {
    var h = document.getElementById('stage').clientHeight - 96;
    var s = Math.min(1, Math.max(0.55, h / 844));
    ['pc', 'pt'].forEach(function (id) { var p = document.getElementById(id); p.style.transform = 'scale(' + s + ')'; p.parentNode.style.height = (844 * s + 30) + 'px'; p.parentNode.style.width = (390 * s) + 'px'; });
  }
  window.addEventListener('resize', fit);
  reset(); load('booking'); fit();
})();
</script>
</body>
</html>
