<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<title>KuArte · Your offers</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="scr">
  <div class="top" style="padding-bottom: 8px">
    <a class="ib" href="Main.dc.html" aria-label="Back to home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <div class="col grow" style="gap: 0"><h1 class="h1">Your design request</h1><span class="cap">{{statusLine}}</span></div>
  </div>
  <div class="scroll" style="gap: 14px">
    <div class="card" style="display: flex; gap: 12px; padding: 10px; align-items: center">
      <div class="ph" style="width: 60px; height: 60px; border-radius: 12px"><img src="./assets/photos/black-cherry.jpg" alt="Your design: black nails with gold lines"></div>
      <div class="col grow" style="gap: 2px"><span class="sm strong">Noir and gold</span><span class="cap">Gel extensions · Almond, medium · This weekend · Walk-in · ₱400–600</span></div>
    </div>

    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
      <div class="col" style="gap: 12px">
        <div class="row between"><span class="sm"><b class="strong">4 offers</b> · pick a time to choose one</span></div>
        <div class="seg"><sc-for list="{{sorts}}" as="s" hint-placeholder-count="3"><button class="{{s.cls}}" onClick="{{s.pick}}">{{s.name}}</button></sc-for></div>
        <sc-for list="{{offers}}" as="o" hint-placeholder-count="4">
          <article class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: {{o.ring}}">
            <div class="row" style="gap: 10px; align-items: flex-start">
              <span class="av {{o.av}}">{{o.ini}}</span>
              <div class="col grow" style="gap: 1px">
                <span class="sm strong">{{o.name}}</span>
                <span class="cap">★ {{o.rating}} ({{o.count}}) · {{o.dist}}</span>
                <span class="badge {{o.bcls}}" style="align-self: flex-start; margin-top: 3px">{{o.badge}}</span>
              </div>
              <div class="col" style="gap: 0; align-items: flex-end"><b class="price" style="font-size: 20px">₱{{o.price}}</b><span class="cap">fixed quote</span></div>
            </div>
            <div class="row" style="gap: 6px">
              <div class="ph" style="width: 72px; height: 72px; border-radius: 10px"><img src="{{o.img1}}" alt="Sample of similar work by {{o.name}}"><span class="ver" style="left: 4px; top: 4px; padding: 0 5px"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span></div>
              <div class="ph" style="width: 72px; height: 72px; border-radius: 10px"><img src="{{o.img2}}" alt="Sample of similar work by {{o.name}}"><span class="ver" style="left: 4px; top: 4px; padding: 0 5px"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span></div>
              <p class="cap grow" style="color: #22161A">“{{o.note}}”</p>
            </div>
            <div class="wrap-row" style="gap: 6px">
              <sc-for list="{{o.slots}}" as="t" hint-placeholder-count="2"><button class="chip {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
            </div>
            <span class="cap">{{o.depText}}</span>
          </article>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{booked}}" hint-placeholder-val="{{ false }}">
      <div class="col" style="gap: 14px">
        <div class="banner" role="status" style="padding: 16px; border-radius: 16px; background: #E3F2E8; display: flex; flex-direction: column; gap: 6px">
          <span class="pill ok" style="align-self: flex-start; background: #FFFFFF">Confirmed</span>
          <p class="ttl">You're booked with {{chosen.name}}</p>
          <p class="sm" style="color: #1F4D33">{{chosen.when}} · ₱{{chosen.price}} fixed quote. {{chosen.depDone}} The other techs were told you chose someone else.</p>
        </div>
        <div class="card pad" style="display: flex; flex-direction: column; gap: 8px">
          <div class="row between sm"><span>Quote</span><span class="strong">₱{{chosen.price}}</span></div>
          <div class="row between sm"><span>Deposit</span><span>{{chosen.depLine}}</span></div>
          <div class="row between sm"><span>Pay at your visit</span><span>₱{{chosen.rest}}</span></div>
          <p class="cap">A quote can only change at the visit if you confirm it, and any change shows on your review.</p>
        </div>
        <div class="row" style="gap: 10px">
          <a class="btn bs" href="m15-chat.dc.html" style="flex: 1">Message</a>
          <a class="btn bp" href="m13-checkin.dc.html" style="flex: 1.4">Check-in (demo)</a>
        </div>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <div class="foot">
      <div class="row between"><span class="sm strong">{{pickLine}}</span><span class="sm">{{pickPrice}}</span></div>
      <button class="btn bp full" onClick="{{accept}}" style="opacity: {{btnOpacity}}">{{acceptLabel}}</button>
    </div>
  </sc-if>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sort: 0, pick: null, booked: false, nudge: false }; }
  renderVals() {
    const B = './assets/';
    const O = [
      { id: 'viper', name: 'Viper Cullen Nail Studio', ini: 'VC', av: '', rating: '4.9', count: 38, km: 1.2, price: 480, dep: 150, badge: 'Top Rated', bcls: 'gold', img1: B + 'photos/black-cherry.jpg', img2: B + 'photos/burgundy-gloss.jpg', note: 'I did this exact set last month. Matte top coat, hand-drawn gold.', slots: ['Sat 10:00 AM', 'Sat 2:30 PM', 'Sun 1:00 PM'] },
      { id: 'killjoy', name: 'Killjoy Nails', ini: 'KN', av: 'd', rating: '4.8', count: 21, km: 2.4, price: 420, dep: 0, badge: 'Reliable', bcls: '', img1: B + 'photos/sapphire-chrome.jpg', img2: B + 'photos/black-cherry.jpg', note: 'Gold foil strips instead of paint, lasts longer.', slots: ['Sat 4:00 PM', 'Sun 10:00 AM'] },
      { id: 'reyna', name: 'Reyna Nail Studio', ini: 'RN', av: 'c', rating: '4.7', count: 16, km: 3.1, price: 400, dep: 0, badge: 'Verified Work', bcls: '', img1: B + 'photos/soft-french.jpg', img2: B + 'photos/milky-dots.jpg', note: 'Can do it in about 2 hours.', slots: ['Sun 2:00 PM'] },
      { id: 'lumi', name: 'Lumi Nails by Kat', ini: 'LK', av: 'e', rating: '5.0', count: 4, km: 3.8, price: 380, dep: 100, badge: 'New on KuArte', bcls: 'new', img1: B + 'photos/cafe-dots.jpg', img2: B + 'photos/gold-leaf-tips.jpg', note: 'New here, would love to do this one!', slots: ['Sat 9:00 AM', 'Sun 11:00 AM'] }
    ];
    const KU = window.KU;
    const myOffer = KU ? KU.get('offer', null) : null;
    if (myOffer) { O[0].price = myOffer.price; O[0].slots = myOffer.slots; O[0].note = 'Offer sent from the tech side: ' + O[0].note; }
    const bk = KU ? KU.booking() : null;
    const st = this.state;
    const sorted = O.slice().sort(st.sort === 0 ? (a, b) => a.km - b.km : st.sort === 1 ? (a, b) => a.price - b.price : (a, b) => b.rating - a.rating || b.count - a.count);
    let sel = st.pick ? O.find((o) => o.id === st.pick.id) : null;
    const fromStore = !st.booked && bk && bk.source === 'design';
    if (fromStore) sel = O.find((o) => o.id === bk.tech) || O[0];
    const slot = fromStore ? bk.when : (st.pick ? st.pick.slot : '');
    const depText = (o) => o.dep ? 'Deposit ₱' + o.dep + ' to hold the slot · held by KuArte' : 'No deposit needed';
    const offers = sorted.map((o) => ({
      ...o, dist: o.km + ' km',
      ring: sel && sel.id === o.id ? 'inset 0 0 0 1.5px #5E1720' : 'none',
      depText: depText(o),
      slots: o.slots.map((label) => ({ label, cls: sel && sel.id === o.id && slot === label ? 'on' : '', pick: () => this.setState({ pick: { id: o.id, slot: label }, nudge: false }) }))
    }));
    const chosen = sel ? {
      name: sel.name, when: slot, price: sel.price, rest: sel.price - sel.dep,
      depLine: sel.dep ? '₱' + sel.dep + ' paid · held by KuArte' : 'None',
      depDone: sel.dep ? 'Your ₱' + sel.dep + ' deposit is held by KuArte.' : ''
    } : {};
    return {
      open: !(st.booked || fromStore), booked: st.booked || fromStore,
      statusLine: (st.booked || fromStore) ? 'Closed · you chose an offer' : 'Open · 21 hr left · posted 3 hr ago',
      sorts: ['Nearest', 'Lowest price', 'Top rated'].map((name, i) => ({ name, cls: st.sort === i ? 'on' : '', pick: () => this.setState({ sort: i }) })),
      offers, chosen,
      pickLine: sel ? sel.name.split(' ')[0] + ' · ' + slot : (st.nudge ? 'Pick a time on an offer first' : 'No offer chosen yet'),
      pickPrice: sel ? '₱' + sel.price : '',
      btnOpacity: sel ? 1 : 0.55,
      acceptLabel: sel ? (sel.dep ? 'Accept and pay ₱' + sel.dep + ' deposit' : 'Accept offer') : 'Accept offer',
      accept: () => {
        if (!sel) { this.setState({ nudge: true }); return; }
        if (KU) KU.create({ source: 'design', tech: sel.id, techName: sel.name, customer: (KU.get('draft', {}).name) || 'Maria Santos',
          svc: 'Gel extensions · Noir and gold', mode: 'Walk-in', when: st.pick.slot, total: sel.price, deposit: sel.dep, rest: sel.price - sel.dep,
          img: B + 'photos/black-cherry.jpg', status: 'confirmed' });
        this.setState({ booked: true });
      }
    };
  }
}
</script>
</body>
</html>
