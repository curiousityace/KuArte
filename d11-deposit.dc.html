<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<script src="./shared.js" defer></script>
<title>KuArte · Deposit (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d01-home.dc.html" aria-label="KuArte home"><img class="logo" src="./assets/photos/logo-h.png" alt="KuArte"></a>
    <span class="grow"></span>
    <span class="row cap" style="gap: 6px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure booking</span>
    <a class="lnk" href="d06-profile.dc.html">Exit</a>
  </div></header>
  <div class="dwrap" style="gap: 28px; max-width: 1120px">
    <div class="col" style="gap: 12px">
      <a class="lnk row" href="d10-guest.dc.html" style="gap: 4px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back to details</a>
      <h1 class="dtitle">Pay your deposit</h1>
      <div class="wrap-row" style="gap: 8px 24px">
        <span class="row sm" style="gap: 8px"><span class="av s" style="width: 26px; height: 26px"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span>Service</span>
        <span class="row sm" style="gap: 8px"><span class="av s" style="width: 26px; height: 26px"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span>Date and time</span>
        <span class="row sm" style="gap: 8px"><span class="av s" style="width: 26px; height: 26px"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span>Your details</span>
        <span class="row sm strong wine" style="gap: 8px"><span class="av s" style="width: 26px; height: 26px; font-size: 12px">4</span>Deposit</span>
      </div>
    </div>
    <div class="dsplit">
      <div class="dmain" style="gap: 20px; max-width: 640px">
        <div class="col" style="gap: 10px">
          <span class="lbl">Pay with</span>
          <sc-for list="{{methods}}" as="m" hint-placeholder-count="2">
            <button class="opt {{m.cls}}" onClick="{{m.pick}}" style="width: 100%; text-align: left; font-family: 'DM Sans', system-ui, sans-serif">
              <span class="radio {{m.cls}}"></span>
              <span style="width: 44px; height: 44px; border-radius: 10px; background: {{m.tint}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></svg></span>
              <span class="col grow" style="gap: 1px"><span class="ttl" style="font-size: 15px">{{m.name}}</span><span class="cap">{{m.note}}</span></span>
            </button>
          </sc-for>
        </div>
        <div class="tint" style="padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start">
          <svg class="i l" viewBox="0 0 24 24" aria-hidden="true" style="color: #2F7A4E"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
          <div class="col" style="gap: 4px"><span class="ttl" style="font-size: 15px">How your deposit is protected</span><p class="sm">KuArte holds it until your appointment is done. If Viper declines, doesn't reply in 4 hours, cancels, or doesn't show up, it comes straight back to you.</p></div>
        </div>
      </div>
      <aside class="dside">
        <div class="card pad-l shadow" style="display: flex; flex-direction: column; gap: 12px">
          <div class="row" style="gap: 12px"><div class="ph" style="width: 56px; height: 56px; border-radius: 12px"><img src="./assets/photos/burgundy-gloss.jpg" alt=""></div><div class="col" style="gap: 0"><span class="sm strong">{{svcName}}</span><span class="cap">Viper Cullen · {{when}}</span></div></div>
          <div class="hr"></div>
          <div class="row between sm"><span>Estimated price</span><span>₱{{total}}</span></div>
          <div class="row between sm"><span>First booking · KUARTE10</span><span style="color: #2F7A4E">−₱{{disc}}</span></div>
          <div class="hr"></div>
          <div class="row between"><span class="sm strong">Deposit now</span><b class="price" style="font-size: 22px">₱150</b></div><div class="row between sm"><span>KuArte booking fee · refunded if the Nail Technician cancels or doesn't show</span><span>₱20</span></div>
          <div class="row between sm"><span>Pay at your visit</span><span>about ₱{{rest}}</span></div>
          <a class="btn bp full" href="d12-status.dc.html?toast=Deposit%20paid.%20Your%20request%20is%20with%20Viper." onClick="{{pay}}"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Pay ₱170 with {{methodName}}</a>
          <p class="cap" style="text-align: center">This sends your request to Viper</p>
        </div>
      </aside>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: 0 }; }
  renderVals() {
    const KU = window.KU; const d = KU ? KU.get('draft', {}) : {};
    const svcName = d.svc || 'Gel extensions + chrome nail art', mode = d.mode || 'Walk-in', when = d.when || 'Wed, Nov 4 · 2:30 PM', total = d.total || 550, dur = d.dur || '2 hr';
    const disc = Math.round(total * 0.1), rest = total - disc - 150;
        const M = [
      { name: 'GCash', note: 'Scan the QR or pay in the GCash app', tint: '#2F5FB3' },
      { name: 'Maya', note: 'Scan the QR or pay in the Maya app', tint: '#2F7A4E' }
    ];
    return {
      svcName, mode, when, total, disc, rest,
      pay: () => { if (KU) KU.create({ source: 'booking', tech: 'viper', techName: 'Viper Cullen', customer: d.name || 'Maria Santos', phone: d.phone || '', note: d.note || '', svc: svcName, mode, when, total, deposit: 150, rest, img: './assets/photos/burgundy-gloss.jpg', status: 'requested' }); },
            methods: M.map((m, i) => ({ ...m, cls: this.state.m === i ? 'on' : '', pick: () => this.setState({ m: i }) })),
      methodName: M[this.state.m].name
    };
  }
}
</script>
</body>
</html>
