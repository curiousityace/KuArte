<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>KuArte · My bookings (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d01-home.dc.html">KUARTE</a>
    <nav class="dnav grow" aria-label="Main"><a href="d01-home.dc.html">Explore</a><a href="d04-designs.dc.html">Designs</a><a class="on" href="d12-status.dc.html">My bookings</a><a href="d15-chat.dc.html">Messages</a></nav>
    <span class="av s">MS</span>
  </div></header>
  <div class="dwrap">
    <h1 class="dtitle">My bookings</h1>
    <div class="dsplit">
      <aside class="dside" style="flex: 1 1 300px; max-width: 380px">
        <span class="lbl">Upcoming</span>
        <div class="card" style="display: flex; gap: 12px; padding: 12px; align-items: center; box-shadow: inset 0 0 0 1.5px #5E1720">
          <div class="ph" style="width: 56px; height: 56px; border-radius: 12px"><img src="./assets/n1-burgundy-chrome.svg" alt=""></div>
          <div class="col grow" style="gap: 2px"><span class="sm strong">Viper Cullen</span><span class="cap">Wed, Nov 4 · 2:30 PM</span></div>
          <span class="pill {{pill}}">{{pillText}}</span>
        </div>
        <span class="lbl" style="margin-top: 12px">Past</span>
        <div class="card" style="display: flex; gap: 12px; padding: 12px; align-items: center">
          <div class="ph" style="width: 56px; height: 56px; border-radius: 12px"><img src="./assets/n4-milky-dots.svg" alt=""></div>
          <div class="col grow" style="gap: 2px"><span class="sm strong">Reyna Nail Studio</span><span class="cap">Oct 12 · Gel manicure</span></div>
          <a class="lnk" href="d06-profile.dc.html">Book again</a>
        </div>
      </aside>
      <div class="dmain" style="gap: 20px">
        <sc-if value="{{notYet}}" hint-placeholder-val="{{ true }}">
          <div style="padding: 20px 24px; border-radius: 18px; background: #FBEFD9; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
            <div class="col grow" style="gap: 4px; min-width: 260px"><span class="ttl">Viper accepted. Confirm to lock it in.</span><span class="sm" style="color: #5A3A0E">Both sides confirm so nobody gets surprised. Your slot is held for 2 hours.</span></div>
            <button class="btn bp" onClick="{{confirm}}">Confirm booking</button>
          </div>
        </sc-if>
        <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 20px 24px; border-radius: 18px; background: #E3F2E8; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
            <div class="col grow" style="gap: 4px; min-width: 260px"><span class="ttl">You're booked for Wed, Nov 4 at 2:30 PM</span><span class="sm" style="color: #1F4D33">SMS reminders a day before and 2 hours before. Check-in opens 30 minutes before.</span></div>
            <a class="btn bp" href="d13-checkin.dc.html">Open check-in (demo)</a>
          </div>
        </sc-if>
        <div class="dsplit" style="gap: 20px">
          <div class="card pad-l" style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px">
            <span class="lbl">Booking KA-20491</span>
            <div class="row" style="gap: 14px"><div class="ph" style="width: 88px; height: 88px; border-radius: 14px"><img src="./assets/n1-burgundy-chrome.svg" alt="Burgundy chrome reference"></div><div class="col" style="gap: 3px"><span class="ttl">Gel extensions + chrome art</span><span class="cap">Viper Cullen Nail Studio · Walk-in, Gredu</span><span class="cap strong wine">Wed, Nov 4 · 2:30 – 4:30 PM</span></div></div>
            <div class="hr"></div>
            <div class="row between sm"><span>Deposit paid (held by KuArte)</span><span>₱150</span></div>
            <div class="row between sm"><span>Pay at your visit</span><span>about ₱345</span></div>
            <div class="row" style="gap: 10px; flex-wrap: wrap; padding-top: 4px"><a class="btn sm bs" href="d15-chat.dc.html">Message Viper</a><button class="btn sm bg">Reschedule</button><button class="btn sm bd">Cancel</button></div>
          </div>
          <div class="card pad-l" style="flex: 1 1 280px">
            <div class="tl">
              <div class="st done"><span class="k"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span><div class="col" style="gap: 1px"><span class="sm strong">Requested</span><span class="cap">Today 9:12 AM · deposit held</span></div></div>
              <div class="st done"><span class="k"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span><div class="col" style="gap: 1px"><span class="sm strong">Accepted by Viper</span><span class="cap">Today 9:40 AM</span></div></div>
              <div class="st {{c3}}"><span class="k"><sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></sc-if></span><div class="col" style="gap: 1px"><span class="sm strong">Confirmed by you</span><span class="cap">{{confirmNote}}</span></div></div>
              <div class="st {{c4}}"><span class="k"></span><div class="col" style="gap: 1px"><span class="sm strong">Check in</span><span class="cap">Opens Nov 4, 2:00 PM</span></div></div>
              <div class="st"><span class="k"></span><div class="col" style="gap: 1px"><span class="sm strong">Completed + review</span><span class="cap">Deposit released to Viper after</span></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { c: false }; }
  renderVals() {
    const c = this.state.c;
    return {
      notYet: !c, done: c, c3: c ? 'done' : 'now', c4: c ? 'now' : '',
      confirmNote: c ? 'Today 9:45 AM' : 'Waiting for you',
      pill: c ? 'ok' : 'wait', pillText: c ? 'Confirmed' : 'Your turn',
      confirm: () => this.setState({ c: true })
    };
  }
}
</script>
</body>
</html>
