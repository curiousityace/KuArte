<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<script src="./shared.js" defer></script>
<title>KuArte · Leave a review (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d01-home.dc.html" aria-label="KuArte home"><img class="logo" src="./assets/photos/logo-h.png" alt="KuArte"></a>
    <nav class="dnav grow" aria-label="Main"><a href="d01-home.dc.html">Explore</a><a href="d04-designs.dc.html">Designs</a><a class="on" href="d12-status.dc.html">My bookings</a><a href="d15-chat.dc.html">Messages</a></nav>
    <a class="av s" href="login.html" aria-label="Log in or switch account" style="text-decoration: none">MS</a>
  </div></header>
  <div class="dwrap" style="max-width: 1040px">
    <div class="col" style="gap: 6px"><h1 class="dtitle">How did it go with Viper?</h1><p class="sm">Gel extensions + chrome art · Wed, Nov 4</p></div>
    <div class="dsplit">
      <div class="dmain" style="gap: 24px">
        <div class="col" style="gap: 10px">
          <span class="lbl">Your rating</span>
          <div class="row" style="gap: 6px">
            <sc-for list="{{stars}}" as="s" hint-placeholder-count="5"><button onClick="{{s.pick}}" aria-label="{{s.aria}}" style="border: 0; background: none; padding: 2px; cursor: pointer; color: {{s.col}}"><svg class="i f" viewBox="0 0 24 24" aria-hidden="true" style="width: 40px; height: 40px"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button></sc-for>
          </div>
        </div>
        <div class="col" style="gap: 10px">
          <span class="lbl">Did it match your reference?</span>
          <div class="seg" style="max-width: 420px"><button class="{{m0}}" onClick="{{mYes}}">Yes</button><button class="{{m1}}" onClick="{{mPart}}">Partly</button><button class="{{m2}}" onClick="{{mNo}}">No</button></div>
        </div>
        <div class="row" style="gap: 14px; flex-wrap: wrap">
          <div class="col" style="gap: 6px"><div class="ph" style="width: 200px; height: 200px; border-radius: 16px"><img src="./assets/photos/burgundy-gloss.jpg" alt="Your reference"></div><span class="lbl">Reference</span></div>
          <div class="col" style="gap: 6px"><div class="ph" style="width: 200px; height: 200px; border-radius: 16px"><img src="./assets/photos/burgundy-gloss.jpg" alt="Result photo taken at the booking"><span class="ver"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>Verified</span></div><span class="lbl">Result, taken by Viper</span></div>
        </div>
        <button class="btn sm bg" type="button" style="align-self: flex-start" data-soon="Photo upload" data-msg="Adding your own photo to a review is coming soon.">+ Add your own photo</button>
        <div class="field" style="max-width: 640px"><label for="dr-text">Tell others about it (optional)</label><textarea id="dr-text" class="inp">Chrome came out exactly like my photo. Clean work and on time.</textarea></div>
        <label class="row" style="gap: 10px; cursor: pointer"><span class="check {{shareCls}}" role="checkbox" aria-checked="{{shareAria}}" tabindex="0" onClick="{{toggleShare}}"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span><span class="sm" style="color: #22161A">Let Viper add the result photo to her portfolio as Verified</span></label>
        <div class="row" style="gap: 12px"><a class="btn bp" href="d01-home.dc.html?toast=Review%20posted.%20Thanks%20for%20helping%20others%20choose." onClick="{{post}}">Post review</a><a class="btn bg" href="d12-status.dc.html">Later</a></div>
      </div>
      <aside class="dside">
        <div class="tint" style="padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <div class="row between"><span class="sm strong">Final price from Viper</span><b class="price" style="font-size: 20px">₱495</b></div>
          <span class="cap">Deposit ₱150 applied · you paid ₱345 at the studio</span>
          <span class="pill ok" style="align-self: flex-start"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg>You confirmed this price</span>
        </div>
        <div class="card pad" style="display: flex; flex-direction: column; gap: 6px">
          <span class="sm strong">Something wrong with your set?</span>
          <p class="cap">Report it within 24 hours with a photo. Viper can offer a free fix or a partial refund.</p>
          <button class="lnk" style="border: 0; background: none; padding: 0; text-align: left; cursor: pointer">Report a problem</button>
        </div>
      </aside>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { r: 5, m: 0, share: true }; }
  renderVals() {
    const st = this.state;
    return {
      stars: [1, 2, 3, 4, 5].map((n) => ({ col: n <= st.r ? '#C49A45' : '#E9D3D5', aria: n + ' star' + (n > 1 ? 's' : ''), pick: () => this.setState({ r: n }) })),
      shareCls: st.share ? 'on' : '', shareAria: st.share ? 'true' : 'false', toggleShare: () => this.setState({ share: !st.share }),
      post: () => { const el = document.getElementById('dr-text'); if (window.KU) KU.set('review', { stars: st.r, match: st.m, text: el ? el.value.trim() : '', share: st.share }); },
      m0: st.m === 0 ? 'on' : '', m1: st.m === 1 ? 'on' : '', m2: st.m === 2 ? 'on' : '',
      mYes: () => this.setState({ m: 0 }), mPart: () => this.setState({ m: 1 }), mNo: () => this.setState({ m: 2 })
    };
  }
}
</script>
</body>
</html>
