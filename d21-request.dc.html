<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<script src="./shared.js" defer></script>
<title>KuArte for techs · Requests (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d22-dashboard.dc.html" aria-label="KuArte home"><img class="logo" src="./assets/photos/logo-h.png" alt="KuArte"></a><span class="badge">For nail techs</span>
    <nav class="dnav grow" aria-label="Tech"><a href="d22-dashboard.dc.html">Bookings</a><a class="on" href="d21-request.dc.html">Requests</a><a href="chat.html?as=tech">Messages</a><a href="d27-design-requests.dc.html">Design requests</a><a href="d19-camera.dc.html">Portfolio</a><a href="d24-insights.dc.html">Insights</a></nav>
    <button type="button" class="av s" data-soon="Account settings" data-msg="Account settings are coming soon." aria-label="Your account">VC</button>
  </div></header>
  <div class="dwrap">
    <div class="row between" style="flex-wrap: wrap; gap: 12px"><h1 class="dtitle">{{title}}</h1>
      <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}"><span class="pill info"><span style="width: 6px; height: 6px; border-radius: 3px; background: #2F7A4E"></span>Live from the customer app · {{b.created}}</span></sc-if>
    </div>
    <div class="dsplit">
      <aside class="dside" style="flex: 1 1 280px; max-width: 360px">
        <div class="card" style="display: flex; gap: 12px; padding: 14px; align-items: center; box-shadow: inset 0 0 0 1.5px #5E1720">
          <span class="av e">{{ini}}</span>
          <div class="col grow" style="gap: 1px"><span class="sm strong">{{b.customer}}</span><span class="cap">{{b.when}}</span></div>
        </div>
        <p class="cap" style="padding: 4px 2px">Requests you don't answer within 4 hours expire and the customer is refunded.</p>
      </aside>
      <div class="dmain">
        <div class="card pad-l" style="display: flex; flex-direction: column; gap: 20px">
          <div class="row" style="gap: 14px; flex-wrap: wrap">
            <span class="av e">{{ini}}</span>
            <div class="col grow" style="gap: 1px"><span class="ttl">{{b.customer}}</span><span class="cap">Phone verified · first booking with you</span></div>
            <span class="cap" style="color: {{subColor}}; font-weight: 600">{{sub}}</span>
            <a class="btn sm bs" href="chat.html?as=tech">Message</a>
          </div>
          <div class="row" style="gap: 24px; flex-wrap: wrap; align-items: flex-start">
            <div class="col" style="gap: 6px"><div class="ph" style="width: 240px; height: 240px; border-radius: 18px"><img src="{{b.img}}" alt="Customer's reference photo"></div><span class="lbl">Her reference</span></div>
            <div class="col grow" style="gap: 12px; min-width: 260px">
              <div class="tbox"><table class="dtable"><tbody>
                <tr><td class="cap">Service</td><td class="strong">{{b.svc}}</td></tr>
                <tr><td class="cap">When</td><td class="strong">{{b.when}}</td></tr>
                <tr><td class="cap">Where</td><td class="strong">{{b.mode}}</td></tr>
                <tr><td class="cap">Estimated</td><td class="price">₱{{b.total}}</td></tr>
                <tr><td class="cap">Deposit</td><td><span class="pill ok">₱{{b.deposit}} paid · held by KuArte</span></td></tr>
              </tbody></table></div>
              <sc-if value="{{hasNote}}" hint-placeholder-val="{{ true }}"><div class="tint" style="padding: 12px 14px"><span class="cap strong wine">Note from {{first}}</span><p class="sm" style="color: #22161A; margin-top: 2px">{{b.note}}</p></div></sc-if>
            </div>
          </div>
          <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
            <div class="row" style="gap: 12px; flex-wrap: wrap"><button class="btn bp" onClick="{{accept}}">Accept request</button><button class="btn bs">Suggest another time</button><button class="btn bd" onClick="{{decline}}">Decline</button></div>
          </sc-if>
          <sc-if value="{{hasOutcome}}" hint-placeholder-val="{{ false }}">
            <div class="banner" role="status" style="padding: 14px 16px; border-radius: 14px; background: {{outBg}}; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between"><span class="sm strong" style="color: {{outInk}}">{{outcome}}</span><a class="lnk" href="d22-dashboard.dc.html">Back to bookings</a></div>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { sample: { customer: 'Maria Santos', svc: 'Gel extensions + chrome nail art', when: 'Wed, Nov 4 · 2:30 PM', mode: 'Walk-in', total: 550, deposit: 150, created: '9:12 AM',
      note: 'Same length as the photo please. A little darker chrome if possible.', img: './assets/photos/burgundy-gloss.jpg', status: 'requested', log: [] } };
  }
  renderVals() {
    const KU = window.KU;
    const stored = KU ? KU.booking() : null;
    const live = !!(stored && stored.source === 'booking' && stored.tech === 'viper');
    const b = live ? stored : this.state.sample;
    const upd = (patch, note) => { if (live) KU.update(patch, note); else this.setState({ sample: Object.assign({}, b, patch) }); };
    const first = (b.customer || 'Customer').split(' ')[0];
    const ini = (b.customer || 'C').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const s = b.status;
    const OUT = {
      accepted: ['Accepted. Waiting for ' + first + ' to confirm.', '#E3F2E8', '#1F4D33'],
      confirmed: [first + ' confirmed. It\'s in your Upcoming bookings.', '#E3F2E8', '#1F4D33'],
      declined: ['You declined. ' + first + '\'s deposit is refunded.', '#FBE4E6', '#8A1B29'],
      cancelled: [first + ' cancelled. Her deposit was refunded.', '#FBE4E6', '#8A1B29']
    }[s];
    return {
      b, first, ini, isLive: live,
      title: s === 'requested' ? 'New request' : 'Booking request',
      sub: s === 'requested' ? 'Reply within 3 hr 59 min' : (s === 'confirmed' ? 'Confirmed by both sides' : (s === 'accepted' ? 'Waiting for the customer' : 'Closed')),
      subColor: s === 'requested' ? '#8A5212' : '#6B5A5E',
      hasNote: !!b.note,
      pending: s === 'requested', hasOutcome: !!OUT,
      outcome: OUT ? OUT[0] : '', outBg: OUT ? OUT[1] : '', outInk: OUT ? OUT[2] : '',
      accept: () => upd({ status: 'accepted' }, 'Accepted by Viper'),
      decline: () => upd({ status: 'declined' }, 'Declined by Viper')
    };
  }
}
</script>
</body>
</html>
