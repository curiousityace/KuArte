<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>KuArte for techs · Requests (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d22-dashboard.dc.html">KUARTE</a><span class="badge">For nail techs</span>
    <nav class="dnav grow" aria-label="Tech"><a href="d22-dashboard.dc.html">Bookings</a><a class="on" href="d21-request.dc.html">Requests</a><a href="d19-camera.dc.html">Portfolio</a><a href="d20-availability.dc.html">Availability</a><a href="d24-insights.dc.html">Insights</a></nav>
    <span class="av s">VC</span>
  </div></header>
  <div class="dwrap">
    <h1 class="dtitle">Requests</h1>
    <div class="dsplit">
      <aside class="dside" style="flex: 1 1 280px; max-width: 360px">
        <div class="card" style="display: flex; gap: 12px; padding: 14px; align-items: center; box-shadow: inset 0 0 0 1.5px #5E1720">
          <span class="av e">MS</span>
          <div class="col grow" style="gap: 1px"><span class="sm strong">Maria Santos</span><span class="cap">Wed, Nov 4 · 2:30 PM</span></div>
          <span class="pill {{pill}}">{{pillText}}</span>
        </div>
        <p class="cap" style="padding: 4px 2px">Requests you don't answer within 4 hours expire and the customer is refunded.</p>
      </aside>
      <div class="dmain">
        <div class="card pad-l" style="display: flex; flex-direction: column; gap: 20px">
          <div class="row" style="gap: 14px; flex-wrap: wrap">
            <span class="av e">MS</span>
            <div class="col grow" style="gap: 1px"><span class="ttl">Maria Santos</span><span class="cap">Guest · phone verified · first booking with you</span></div>
            <span class="cap" style="color: #8A5212; font-weight: 600">Reply within 3 hr 52 min</span>
            <a class="btn sm bs" href="d15-chat.dc.html">Message</a>
          </div>
          <div class="row" style="gap: 24px; flex-wrap: wrap; align-items: flex-start">
            <div class="col" style="gap: 6px"><div class="ph" style="width: 240px; height: 240px; border-radius: 18px"><img src="./assets/n1-burgundy-chrome.svg" alt="Customer reference: burgundy chrome almond nails"></div><span class="lbl">Her reference</span></div>
            <div class="col grow" style="gap: 12px; min-width: 260px">
              <div class="tbox"><table class="dtable"><tbody>
                <tr><td class="cap">Service</td><td class="strong">Gel extensions + chrome nail art</td></tr>
                <tr><td class="cap">When</td><td class="strong">Wed, Nov 4 · 2:30 – 4:30 PM</td></tr>
                <tr><td class="cap">Where</td><td class="strong">Walk-in at your studio</td></tr>
                <tr><td class="cap">Estimated</td><td class="price">₱550</td></tr>
                <tr><td class="cap">Deposit</td><td><span class="pill ok">₱150 paid · held by KuArte</span></td></tr>
              </tbody></table></div>
              <div class="tint" style="padding: 12px 14px"><span class="cap strong wine">Note from Maria</span><p class="sm" style="color: #22161A; margin-top: 2px">Same length as the photo please. A little darker chrome if possible.</p></div>
            </div>
          </div>
          <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
            <div class="row" style="gap: 12px; flex-wrap: wrap"><button class="btn bp" onClick="{{accept}}">Accept request</button><button class="btn bs">Suggest another time</button><button class="btn bd">Decline</button></div>
          </sc-if>
          <sc-if value="{{accepted}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 14px 16px; border-radius: 14px; background: #E3F2E8; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between"><span class="sm strong" style="color: #1F4D33">Accepted. Waiting for Maria to confirm.</span><a class="lnk" href="d22-dashboard.dc.html">Back to bookings</a></div>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ok: false }; }
  renderVals() {
    const ok = this.state.ok;
    return { pending: !ok, accepted: ok, pill: ok ? 'ok' : 'wait', pillText: ok ? 'Accepted' : 'New', accept: () => this.setState({ ok: true }) };
  }
}
</script>
</body>
</html>
