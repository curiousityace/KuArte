<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>KuArte for techs · New request</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="scr">
  <div class="top" style="padding-bottom: 8px">
    <a class="ib" href="m22-dashboard.dc.html" aria-label="Back to bookings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <div class="col grow" style="gap: 0"><h1 class="h1">{{title}}</h1><span class="cap" style="color: {{subColor}}; font-weight: 600">{{sub}}</span></div>
  </div>
  <div class="scroll" style="gap: 14px">
    <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
      <span class="pill info" style="align-self: flex-start"><span style="width: 6px; height: 6px; border-radius: 3px; background: #2F7A4E"></span>Live from the customer app · {{b.created}}</span>
    </sc-if>
    <div class="row" style="gap: 12px">
      <span class="av e">{{ini}}</span>
      <div class="col grow" style="gap: 1px"><span class="ttl">{{b.customer}}</span><span class="cap">Phone verified · first booking with you</span></div>
      <a class="ib" href="m15-chat.dc.html" aria-label="Message customer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></a>
    </div>
    <div class="row" style="gap: 12px; align-items: stretch">
      <div class="col" style="gap: 4px"><div class="ph" style="width: 132px; height: 132px; border-radius: 14px"><img src="{{b.img}}" alt="Customer's reference photo"></div><span class="lbl">Her reference</span></div>
      <div class="card grow" style="padding: 12px; display: flex; flex-direction: column; gap: 8px">
        <span class="sm strong">{{b.svc}}</span>
        <div class="hr"></div>
        <span class="cap strong" style="color: #22161A">{{b.when}}</span>
        <span class="cap">{{b.mode}}</span>
        <span class="cap">Est. <b class="price">₱{{b.total}}</b></span>
      </div>
    </div>
    <sc-if value="{{hasNote}}" hint-placeholder-val="{{ true }}">
      <div class="tint" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
        <span class="cap strong wine">Note from {{first}}</span>
        <p class="sm" style="color: #22161A">{{b.note}}</p>
      </div>
    </sc-if>
    <div class="row" style="gap: 8px; padding: 0 2px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true" style="color: #2F7A4E"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span class="cap">₱{{b.deposit}} deposit paid and held by KuArte</span></div>
    <sc-if value="{{hasOutcome}}" hint-placeholder-val="{{ false }}">
      <div class="banner" role="status" style="padding: 14px; border-radius: 14px; background: {{outBg}}; display: flex; flex-direction: column; gap: 4px">
        <span class="sm strong" style="color: {{outInk}}">{{outcome}}</span>
        <a class="lnk" href="m22-dashboard.dc.html">Back to bookings</a>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
    <div class="foot">
      <button class="btn bp full" onClick="{{accept}}">Accept request</button>
      <div class="row" style="gap: 10px">
        <button class="btn bs" style="flex: 1.4">Suggest another time</button>
        <button class="btn bd" style="flex: 1" onClick="{{decline}}">Decline</button>
      </div>
    </div>
  </sc-if>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { sample: { customer: 'Maria Santos', svc: 'Gel extensions + chrome nail art', when: 'Wed, Nov 4 · 2:30 PM', mode: 'Walk-in', total: 550, deposit: 150, created: '9:12 AM',
      note: 'Same length as the photo please. A little darker chrome if possible.', img: './assets/n1-burgundy-chrome.svg', status: 'requested', log: [] } };
  }
  renderVals() {
    const KU = window.KU;
    const stored = KU ? KU.booking() : null;
    const live = !!(stored && stored.source === 'booking' && stored.tech === 'viper');
    const b = live ? stored : this.state.sample;
    const upd = (patch, note) => { if (live) KU.update(patch, note); else this.setState({ sample: Object.assign({}, b, patch) }); };
    const first = (b.customer || 'Customer').split(' ')[0];
    const ini = (b.customer || 'C').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const s = b.status;
    const OUT = {
      accepted: ['Accepted. Waiting for ' + first + ' to confirm.', '#E3F2E8', '#1F4D33'],
      confirmed: [first + ' confirmed. It\'s in your Upcoming bookings.', '#E3F2E8', '#1F4D33'],
      declined: ['You declined. ' + first + '\'s deposit is refunded.', '#FBE4E6', '#8A1B29'],
      cancelled: [first + ' cancelled. Her deposit was refunded.', '#FBE4E6', '#8A1B29']
    }[s];
    return {
      b, first, ini, isLive: live,
      title: s === 'requested' ? 'New request' : 'Booking request',
      sub: s === 'requested' ? 'Reply within 3 hr 59 min' : (s === 'confirmed' ? 'Confirmed by both sides' : (s === 'accepted' ? 'Waiting for the customer' : 'Closed')),
      subColor: s === 'requested' ? '#8A5212' : '#6B5A5E',
      hasNote: !!b.note,
      pending: s === 'requested', hasOutcome: !!OUT,
      outcome: OUT ? OUT[0] : '', outBg: OUT ? OUT[1] : '', outInk: OUT ? OUT[2] : '',
      accept: () => upd({ status: 'accepted' }, 'Accepted by Viper'),
      decline: () => upd({ status: 'declined' }, 'Declined by Viper')
    };
  }
}
</script>
</body>
</html>
