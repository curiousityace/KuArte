<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>KuArte for techs · New request</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="scr">
  <div class="top" style="padding-bottom: 8px">
    <a class="ib" href="m22-dashboard.dc.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <div class="col grow" style="gap: 0"><h1 class="h1">New request</h1><span class="cap" style="color: #8A5212; font-weight: 600">Reply within 3 hr 52 min</span></div>
  </div>
  <div class="scroll" style="gap: 14px">
    <div class="row" style="gap: 12px">
      <span class="av e">MS</span>
      <div class="col grow" style="gap: 1px"><span class="ttl">Maria Santos</span><span class="cap">Guest · phone verified · first booking with you</span></div>
      <a class="ib" href="m15-chat.dc.html" aria-label="Message Maria"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></a>
    </div>
    <div class="row" style="gap: 12px; align-items: stretch">
      <div class="col" style="gap: 4px"><div class="ph" style="width: 132px; height: 132px; border-radius: 14px"><img src="./assets/n1-burgundy-chrome.svg" alt="Customer reference: burgundy chrome almond nails"></div><span class="lbl">Her reference</span></div>
      <div class="card grow" style="padding: 12px; display: flex; flex-direction: column; gap: 8px">
        <span class="sm strong">Gel extensions</span>
        <span class="cap">+ Chrome nail art</span>
        <div class="hr"></div>
        <span class="cap strong" style="color: #22161A">Wed, Nov 4 · 2:30 PM</span>
        <span class="cap">Walk-in · about 2 hr</span>
        <span class="cap">Est. <b class="price">₱550</b></span>
      </div>
    </div>
    <div class="tint" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
      <span class="cap strong wine">Note from Maria</span>
      <p class="sm" style="color: #22161A">Same length as the photo please. A little darker chrome if possible.</p>
    </div>
    <div class="row" style="gap: 8px; padding: 0 2px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true" style="color: #2F7A4E"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span class="cap">₱150 deposit paid and held by KuArte</span></div>
    <sc-if value="{{accepted}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 14px; border-radius: 14px; background: #E3F2E8; display: flex; flex-direction: column; gap: 4px">
        <span class="sm strong" style="color: #1F4D33">Accepted. Waiting for Maria to confirm.</span>
        <a class="lnk" href="m22-dashboard.dc.html">Back to bookings</a>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
    <div class="foot">
      <button class="btn bp full" onClick="{{accept}}">Accept request</button>
      <div class="row" style="gap: 10px">
        <button class="btn bs" style="flex: 1.4">Suggest another time</button>
        <button class="btn bd" style="flex: 1">Decline</button>
      </div>
    </div>
  </sc-if>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ok: false }; }
  renderVals() {
    return { accepted: this.state.ok, pending: !this.state.ok, accept: () => this.setState({ ok: true }) };
  }
}
</script>
</body>
</html>
