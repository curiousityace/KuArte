<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<script src="./shared.js" defer></script>
<title>KuArte · Check-in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="scr">
  <div class="top" style="padding-bottom: 8px">
    <a class="ib" href="m12-status.dc.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <div class="col grow" style="gap: 0"><h1 class="h1">Check in</h1><span class="cap">Today 2:30 PM · Viper Cullen Nail Studio</span></div>
  </div>
  <div class="scroll" style="gap: 14px">
    <div class="map" style="height: 190px; flex: none">
      <div class="road" style="left: 0; top: 96px; width: 100%; height: 10px"></div>
      <div class="road" style="left: 210px; top: 0; width: 10px; height: 100%"></div>
      <div class="blk" style="left: 20px; top: 20px; width: 150px; height: 60px"></div>
      <div class="blk" style="left: 236px; top: 120px; width: 90px; height: 54px"></div>
      <span class="pin on" style="left: 220px; top: 56px"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10"/><path d="M3 4h18l-1 5a3 3 0 0 1-6 0 3 3 0 0 1-4 0 3 3 0 0 1-6 0z"/></svg>Studio</span>
      <span class="me" style="left: {{meX}}px; top: 128px"></span>
      <span class="tagx" style="position: absolute; right: 10px; top: 10px; display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; background: rgba(34,22,26,.72); color: #FFFFFF; font-size: 11px; font-weight: 600">{{dist}}</span>
    </div>
    <div class="card pad" style="display: flex; flex-direction: column; gap: 12px">
      <div class="row between"><span class="lbl">You</span><span class="pill {{youPill}}">{{youLabel}}</span></div>
      <div class="row" style="gap: 10px">
        <button class="btn {{b1}}" onClick="{{onWay}}" style="flex: 1"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8z"/></svg>On my way</button>
        <button class="btn {{b2}}" onClick="{{here}}" style="flex: 1"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>I'm here</button>
      </div>
      <div class="col" style="gap: 6px">
        <span class="cap">Running late? Let Viper know</span>
        <div class="row" style="gap: 6px"><sc-for list="{{lates}}" as="l" hint-placeholder-count="3"><button class="chip {{l.cls}}" type="button" onClick="{{l.pick}}">{{l.name}}</button></sc-for></div>
      </div>
    </div>
    <div class="card pad" style="display: flex; gap: 12px; align-items: center">
      <span class="av">VC</span>
      <div class="col grow" style="gap: 1px"><span class="sm strong">Viper is at the studio</span><span class="cap">Checked in 2:05 PM · location confirmed</span></div>
      <span class="pill ok">Ready</span>
    </div>
    <sc-if value="{{arrived}}" hint-placeholder-val="{{ false }}">
      <a class="btn bp full" href="m14-review.dc.html">Appointment done (demo)</a>
    </sc-if>
    <p class="cap" style="text-align: center">Your location is shared only from 30 minutes before until you check in. If a Nail Technician hasn't checked in 15 minutes after start, you can report a no-show for a full refund.</p>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 0, late: 0 }; }
  renderVals() {
    const KU = window.KU;
    const bk = KU ? KU.booking() : null;
    const live = bk && bk.tech === 'viper' && bk.status === 'confirmed' ? bk : null;
    const s = live && live.checkin ? (live.checkin === 'here' ? 2 : 1) : this.state.step;
    const ensure = () => {
      if (!KU) return;
      const b = KU.booking();
      if (!b || b.tech !== 'viper' || b.status !== 'confirmed') KU.create({ source: 'booking', tech: 'viper', customer: (b && b.customer) || 'Maria Santos', svc: 'Gel extensions + chrome nail art', mode: 'Walk-in', when: 'Wed, Nov 4 · 2:30 PM', total: 550, deposit: 150, img: 'burgundy', status: 'confirmed' });
    };
    const lateMins = live && live.late ? live.late : this.state.late;
    const sendLate = (n) => {
      ensure();
      if (KU) KU.update({ late: n }, 'Customer running ' + n + ' min late');
      if (window.KUS) KUS.chatPush('c', 'Running about ' + n + ' min late, sorry! On my way.');
      this.setState({ late: n });
      if (KU && KU.toast) KU.toast('Sent to Viper in chat: running about ' + n + ' min late.');
    };
    return {
      b1: s === 1 ? 'bp' : 'bs', b2: s === 2 ? 'bp' : 'bs',
      youPill: s === 0 ? 'info' : (s === 1 ? 'wait' : 'ok'),
      youLabel: s === 0 ? 'Not started' : (s === 1 ? (lateMins ? 'On the way · ' + lateMins + ' min late' : 'On the way') : 'Arrived ' + ((live && live.log && live.log.length) ? live.log[live.log.length - 1].t : '2:24 PM')),
      dist: s === 0 ? 'You are 2.1 km away' : (s === 1 ? 'About 6 min away' : 'You are at the studio'),
      meX: s === 0 ? 40 : (s === 1 ? 130 : 206),
      arrived: s === 2,
      lates: [5, 10, 15].map((n) => ({ name: n + ' min', cls: lateMins === n ? 'on' : '', pick: () => sendLate(n) })),
      onWay: () => { ensure(); if (KU) KU.update({ checkin: 'onway' }, 'Customer is on the way'); this.setState({ step: 1 }); },
      here: () => { ensure(); if (KU) KU.update({ checkin: 'here' }, 'Customer arrived'); this.setState({ step: 2 }); }
    };
  }
}
</script>
</body>
</html>
