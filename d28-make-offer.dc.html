<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<title>KuArte for techs · Make an offer (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d22-dashboard.dc.html" aria-label="KuArte home"><img class="logo" src="./assets/photos/logo-h.png" alt="KuArte"></a><span class="badge">For nail techs</span>
    <nav class="dnav grow" aria-label="Tech"><a href="d22-dashboard.dc.html">Bookings</a><a href="d21-request.dc.html">Requests</a><a class="on" href="d27-design-requests.dc.html">Design requests</a><a href="d19-camera.dc.html">Portfolio</a><a href="d24-insights.dc.html">Insights</a></nav>
    <button type="button" class="av s" data-soon="Account settings" data-msg="Account settings are coming soon." aria-label="Your account">VC</button>
  </div></header>
  <div class="dwrap" style="max-width: 1120px">
    <div class="col" style="gap: 6px">
      <a class="lnk row" href="d27-design-requests.dc.html" style="gap: 4px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Design requests</a>
      <h1 class="dtitle">Make an offer</h1>
      <p class="sm">Posted 25 min ago · 3 offers so far · other techs can't see your price</p>
    </div>
    <div class="dsplit">
      <aside class="dside" style="flex: 1 1 340px; max-width: 420px">
        <div class="ph" style="height: 300px; border-radius: 18px"><img src="./assets/photos/black-cherry.jpg" alt="Requested design: black nails with gold lines"></div>
        <span class="ttl">Noir and gold</span>
        <span class="sm">Gel extensions · Almond, medium · This weekend · Walk-in · 1.4 km away</span>
        <span class="sm">Budget <b class="strong">₱400–600</b></span>
        <div class="tint" style="padding: 12px 14px"><span class="cap strong wine">Note from the customer</span><p class="sm" style="color: #22161A; margin-top: 2px">Matte black with thin gold lines, like the photo. No glitter please.</p></div>
      </aside>
      <div class="dmain" style="gap: 20px">
        <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
          <div class="card pad-l" style="display: flex; flex-direction: column; gap: 20px">
            <div class="col" style="gap: 8px">
              <span class="lbl">Your quote</span>
              <div class="row" style="gap: 16px; flex-wrap: wrap">
                <div class="card" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; width: 300px">
                  <button class="ib" onClick="{{minus}}" aria-label="Lower quote by 20"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
                  <span class="grow" style="text-align: center; font: 700 28px/1 'DM Sans', system-ui, sans-serif; color: #5E1720; font-variant-numeric: tabular-nums">₱{{price}}</span>
                  <button class="ib" onClick="{{plus}}" aria-label="Raise quote by 20"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                </div>
                <span class="cap" style="color: {{budgetColor}}">{{budgetNote}}</span>
              </div>
            </div>
            <div class="col" style="gap: 8px">
              <div class="row between"><span class="lbl">Times you can do</span><span class="cap">{{slotCount}} of 3</span></div>
              <div class="wrap-row" style="gap: 6px"><sc-for list="{{slots}}" as="s" hint-placeholder-count="5"><button class="chip {{s.cls}}" onClick="{{s.pick}}">{{s.label}}</button></sc-for></div>
            </div>
            <div class="col" style="gap: 8px">
              <div class="row between"><span class="lbl">Sample photos</span><span class="cap">{{photoCount}} of 3 · Verified only</span></div>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; max-width: 560px">
                <sc-for list="{{photos}}" as="p" hint-placeholder-count="4">
                  <button onClick="{{p.pick}}" class="ph" aria-pressed="{{p.pressed}}" aria-label="{{p.alt}}" style="height: 120px; border: 0; padding: 0; cursor: pointer; border-radius: 12px; box-shadow: {{p.ring}}"><img src="{{p.img}}" alt=""><span class="ver" style="background: {{p.chip}}; color: {{p.chipText}}"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>Verified</span></button>
                </sc-for>
              </div>
            </div>
            <div class="field"><label for="dmo-note">Note (optional)</label><textarea id="dmo-note" class="inp" style="min-height: 72px">I did this exact set last month. Matte top coat, hand-drawn gold.</textarea></div>
            <div class="row" style="gap: 16px; flex-wrap: wrap; align-items: center">
              <button class="btn bp" onClick="{{send}}" style="opacity: {{btnOpacity}}">Send offer · ₱{{price}}</button>
              <span class="cap">Your deposit setting applies: ₱150.</span>
              <sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}"><span class="cap" role="alert" style="color: #B42335">{{hint}}</span></sc-if>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
          <div class="banner" role="status" style="padding: 20px 24px; border-radius: 18px; background: #E3F2E8; display: flex; flex-direction: column; gap: 6px">
            <span class="ttl">Offer sent · ₱{{price}} · {{slotSummary}}</span>
            <span class="sm" style="color: #1F4D33">The customer sees your offer next to the others. If she picks you, the booking lands in Upcoming with the deposit paid.</span>
            <a class="lnk" href="d27-design-requests.dc.html">Back to design requests</a>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { price: 480, slots: { 'Sat 10:00 AM': true, 'Sat 2:30 PM': true }, photos: { 0: true, 1: true }, sent: false, tried: false }; }
  renderVals() {
    const B = './assets/';
    const st = this.state;
    const S = ['Sat 10:00 AM', 'Sat 2:30 PM', 'Sat 5:00 PM', 'Sun 1:00 PM', 'Sun 3:30 PM'];
    const P = [
      { id: 'photos/black-cherry.jpg', alt: 'Noir and gold' },
      { id: 'photos/burgundy-gloss.jpg', alt: 'Burgundy chrome' },
      { id: 'photos/sapphire-chrome.jpg', alt: 'Emerald cat-eye' },
      { id: 'photos/gold-leaf-tips.jpg', alt: 'Gold leaf nude' }
    ];
    const nSlots = S.filter((s) => st.slots[s]).length;
    const nPhotos = P.filter((p, i) => st.photos[i]).length;
    const ok = nSlots > 0 && nPhotos > 0;
    const inBudget = st.price >= 400 && st.price <= 600;
    return {
      editing: !st.sent, sent: st.sent, price: st.price,
      budgetNote: inBudget ? 'Within the customer\'s budget' : (st.price > 600 ? 'Above the customer\'s budget of ₱400–600' : 'Below the customer\'s budget'),
      budgetColor: inBudget ? '#2F7A4E' : '#8A5212',
      slotCount: nSlots, photoCount: nPhotos,
      slots: S.map((label) => ({ label, cls: st.slots[label] ? 'on' : '', pick: () => {
        const on = !st.slots[label];
        if (on && nSlots >= 3) return;
        this.setState({ slots: { ...st.slots, [label]: on } });
      } })),
      photos: P.map((p, i) => ({
        img: B + p.id, alt: p.alt + (st.photos[i] ? ', selected' : ''), pressed: st.photos[i] ? 'true' : 'false',
        ring: st.photos[i] ? '0 0 0 3px #5E1720' : 'none',
        chip: st.photos[i] ? '#5E1720' : 'rgba(255,255,255,.94)', chipText: st.photos[i] ? '#FFFFFF' : '#5E1720',
        pick: () => {
          const on = !st.photos[i];
          if (on && nPhotos >= 3) return;
          this.setState({ photos: { ...st.photos, [i]: on } });
        }
      })),
      slotSummary: S.filter((s) => st.slots[s]).join(', '),
      showHint: st.tried && !ok,
      hint: nSlots === 0 ? 'Pick at least one time you can do.' : 'Add at least one Verified sample photo.',
      btnOpacity: ok ? 1 : 0.55,
      minus: () => this.setState({ price: Math.max(200, st.price - 20) }),
      plus: () => this.setState({ price: Math.min(1500, st.price + 20) }),
      send: () => { if (!ok) { this.setState({ tried: true }); return; } if (window.KU) window.KU.set('offer', { price: st.price, slots: S.filter((s) => st.slots[s]) }); this.setState({ sent: true }); }
    };
  }
}
</script>
</body>
</html>
