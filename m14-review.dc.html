<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>KuArte · Leave a review</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="scr">
  <div class="top" style="padding-bottom: 8px">
    <a class="ib" href="Main.dc.html" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <div class="col grow" style="gap: 0"><h1 class="h1">How did it go?</h1><span class="cap">Gel extensions with Viper · Nov 4</span></div>
  </div>
  <div class="scroll" style="gap: 18px">
    <div class="tint" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div class="row between"><span class="sm strong">Final price from Viper</span><b class="price" style="font-size: 18px">₱495</b></div>
      <span class="cap">Deposit ₱150 applied · you paid ₱345 at the studio</span>
      <div class="row" style="gap: 8px"><span class="pill ok"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg>You confirmed this price</span></div>
    </div>
    <div class="col" style="gap: 8px; align-items: center">
      <span class="lbl">Your rating</span>
      <div class="row" style="gap: 6px">
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
          <button onClick="{{s.pick}}" aria-label="{{s.aria}}" style="border: 0; background: none; padding: 2px; cursor: pointer; color: {{s.col}}"><svg class="i f" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
        </sc-for>
      </div>
    </div>
    <div class="col" style="gap: 8px">
      <span class="lbl">Did it match your reference?</span>
      <div class="seg">
        <button class="{{m0}}" onClick="{{mYes}}">Yes</button>
        <button class="{{m1}}" onClick="{{mPart}}">Partly</button>
        <button class="{{m2}}" onClick="{{mNo}}">No</button>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div class="col" style="gap: 4px"><div class="ph" style="height: 120px; border-radius: 12px"><img src="./assets/n1-burgundy-chrome.svg" alt="Your reference"></div><span class="lbl">Reference</span></div>
      <div class="col" style="gap: 4px"><div class="ph" style="height: 120px; border-radius: 12px"><img src="./assets/n1-burgundy-chrome.svg" alt="Result photo taken at the booking"><span class="ver" style="left: 6px; top: 6px"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>Verified</span></div><span class="lbl">Result, taken by Viper</span></div>
    </div>
    <div class="field">
      <label for="r-text">Tell others about it (optional)</label>
      <textarea id="r-text" class="inp">Chrome came out exactly like my photo. Clean work and on time.</textarea>
    </div>
    <label class="row" style="gap: 10px; cursor: pointer; align-items: flex-start"><span class="check on"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span><span class="sm" style="color: #22161A">Let Viper add the result photo to her portfolio as Verified</span></label>
  </div>
  <div class="foot">
    <a class="btn bp full" href="Main.dc.html?toast=Review%20posted.%20Thanks%20for%20helping%20others%20choose.">Post review</a>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { r: 5, m: 0 }; }
  renderVals() {
    const st = this.state;
    const stars = [1, 2, 3, 4, 5].map((n) => ({ col: n <= st.r ? '#C49A45' : '#E9D3D5', aria: n + ' star' + (n > 1 ? 's' : ''), pick: () => this.setState({ r: n }) }));
    return {
      stars,
      m0: st.m === 0 ? 'on' : '', m1: st.m === 1 ? 'on' : '', m2: st.m === 2 ? 'on' : '',
      mYes: () => this.setState({ m: 0 }), mPart: () => this.setState({ m: 1 }), mNo: () => this.setState({ m: 2 })
    };
  }
}
</script>
</body>
</html>
