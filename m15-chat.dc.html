<div class="scr">

    <span class="cap" style="align-self: center; padding: 4px 0">Today</span>
    <div class="bub out">Hi Viper! Can the chrome be a little darker than the photo?</div>
    <div class="bub in">Yes po, I'll mix a deeper wine. Do you want them a bit shorter too?</div>

    <button class="ib dark" aria-label="Send"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
  </div>
