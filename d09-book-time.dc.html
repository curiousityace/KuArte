<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<title>KuArte · Book: date and time (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="dpage">
  <header class="dhead"><div class="in">
    <a class="wm" href="d01-home.dc.html">KUARTE</a>
    <span class="grow"></span>
    <span class="row cap" style="gap: 6px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure booking</span>
    <a class="lnk" href="d06-profile.dc.html">Exit</a>
  </div></header>
  <div class="dwrap" style="gap: 28px; max-width: 1120px">
    <div class="col" style="gap: 12px">
      <a class="lnk row" href="d08-book-service.dc.html" style="gap: 4px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back to service</a>
      <h1 class="dtitle">Pick a date and time</h1>
      <div class="wrap-row" style="gap: 8px 24px">
        <span class="row sm" style="gap: 8px"><span class="av s" style="width: 26px; height: 26px"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12 5 5L20 7"/></svg></span>Service</span>
        <span class="row sm strong wine" style="gap: 8px"><span class="av s" style="width: 26px; height: 26px; font-size: 12px">2</span>Date and time</span>
        <span class="row sm" style="gap: 8px"><span class="av s" style="width: 26px; height: 26px; font-size: 12px; background: #E9D3D5; color: #5E1720">3</span>Your details</span>
        <span class="row sm" style="gap: 8px"><span class="av s" style="width: 26px; height: 26px; font-size: 12px; background: #E9D3D5; color: #5E1720">4</span>Deposit</span>
      </div>
    </div>
    <div class="dsplit">
      <div class="dmain" style="flex-direction: row; flex-wrap: wrap; gap: 24px; align-items: flex-start">
        <div class="card" style="padding: 18px; flex: 1 1 340px">
          <div class="row between" style="padding: 0 4px 10px">
            <button class="ib" aria-label="Previous month" style="width: 36px; height: 36px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <span class="ttl">November 2026</span>
            <button class="ib" aria-label="Next month" style="width: 36px; height: 36px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div class="cal">
            <span class="dow">Mo</span><span class="dow">Tu</span><span class="dow">We</span><span class="dow">Th</span><span class="dow">Fr</span><span class="dow">Sa</span><span class="dow">Su</span>
            <sc-for list="{{days}}" as="d" hint-placeholder-count="42">
              <button class="d {{d.cls}}" onClick="{{d.pick}}" style="border: 0; background: {{d.bg}}; font-family: 'DM Sans', system-ui, sans-serif; color: {{d.fg}}" aria-label="{{d.aria}}">{{d.n}}</button>
            </sc-for>
          </div>
        </div>
        <div class="col" style="gap: 12px; flex: 1 1 280px">
          <div class="row between"><span class="lbl">{{dayLabel}}</span><span class="cap">Start times that fit {{dur}}</span></div>
          <div class="slots" style="grid-template-columns: repeat(2, minmax(0, 1fr))">
            <sc-for list="{{slots}}" as="s" hint-placeholder-count="6"><button class="slot {{s.cls}}" onClick="{{s.pick}}" style="font-family: 'DM Sans', system-ui, sans-serif">{{s.t}}</button></sc-for>
          </div>
          <div class="row" style="gap: 16px; padding-top: 4px"><span class="row cap" style="gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #2F7A4E"></span>Open slots</span><span class="row cap" style="gap: 6px"><span style="text-decoration: line-through">12</span>Fully booked</span></div>
        </div>
      </div>
      <aside class="dside">
        <div class="card pad-l shadow" style="display: flex; flex-direction: column; gap: 14px">
          <div class="row" style="gap: 12px"><div class="ph" style="width: 56px; height: 56px; border-radius: 12px"><img src="./assets/photos/burgundy-gloss.jpg" alt=""></div><div class="col" style="gap: 0"><span class="sm strong">{{svcName}}</span><span class="cap">Viper Cullen · {{mode}}</span></div></div>
          <div class="hr"></div>
          <div class="row between sm"><span>When</span><span class="strong">{{summary}}</span></div>
          <div class="row between sm"><span>Starts at</span><b class="price">₱{{total}}</b></div>
          <a class="btn bp full" href="d10-guest.dc.html" onClick="{{save}}">Continue</a>
        </div>
      </aside>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { day: 4, slot: 3 }; }
  renderVals() {
    const full = [7, 12, 21], days = [];
    const dim = (n, aria) => ({ n, cls: 'past', bg: 'transparent', fg: '#A3959A', aria, pick: () => {} });
    [26, 27, 28, 29].forEach((n) => days.push(dim(n, 'October ' + n + ', past')));
    days.push({ n: 30, cls: 'today avail', bg: 'transparent', fg: '#22161A', aria: 'Today', pick: () => {} });
    days.push({ n: 31, cls: 'avail', bg: 'transparent', fg: '#22161A', aria: 'October 31', pick: () => {} });
    for (let n = 1; n <= 30; n++) {
      const isFull = full.indexOf(n) > -1, on = this.state.day === n;
      days.push({ n, cls: (isFull ? 'full' : 'avail') + (on ? ' on' : ''), bg: on ? '#5E1720' : 'transparent', fg: on ? '#FFFFFF' : (isFull ? '#A3959A' : '#22161A'), aria: 'November ' + n + (isFull ? ', fully booked' : ''), pick: isFull ? () => {} : () => this.setState({ day: n, slot: -1 }) });
    }
    [1, 2, 3, 4, 5, 6].forEach((n) => days.push(dim(n, 'December ' + n)));
    const times = ['9:00 AM', '11:00 AM', '1:00 PM', '2:30 PM', '4:30 PM', '6:00 PM'];
    const taken = (this.state.day % 3 === 1) ? [0, 4] : [1, 2];
    const slots = times.map((t, i) => { const off = taken.indexOf(i) > -1; return { t, cls: off ? 'off' : (this.state.slot === i ? 'on' : ''), pick: off ? () => {} : () => this.setState({ slot: i }) }; });
    const dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(2026, 10, this.state.day).getDay()];
    const label = dow + ', Nov ' + this.state.day;
    const KU = window.KU; const d = KU ? KU.get('draft', {}) : {};
    const svcName = d.svc || 'Gel extensions + chrome nail art', mode = d.mode || 'Walk-in', when = d.when || 'Wed, Nov 4 · 2:30 PM', total = d.total || 550, dur = d.dur || '2 hr';
    return { svcName, mode, dur, total, save: (e) => { if (this.state.slot < 0) { if (e && e.preventDefault) e.preventDefault(); this.setState({ need: true }); return; } if (KU) KU.draft({ when: label + ' · ' + times[this.state.slot] }); }, days, slots, dayLabel: label, summary: this.state.slot > -1 ? label + ' · ' + times[this.state.slot] : (this.state.need ? 'Pick an open time first' : 'Pick a time') };
  }
}
</script>
</body>
</html>
