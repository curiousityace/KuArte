<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 0 }; }
  renderVals() {
    const B = './assets/', t = this.state.tab;
    const ids = ['n1-burgundy-chrome.svg', 'n5-autumn-florals.svg', 'n2-gold-leaf.svg', 'n7-noir-gold.svg', 'n8-pastel-mix.svg', 'n4-milky-dots.svg', 'n3-classic-french.svg', 'n6-emerald-cateye.svg'];
    const names = ['Burgundy chrome', 'Autumn florals', 'Gold leaf nude', 'Noir and gold', 'Pastel mix', 'Milky dots', 'Classic French', 'Emerald cat-eye'];
    return {
      t0: t === 0 ? 'on' : '', t1: t === 1 ? 'on' : '', t2: t === 2 ? 'on' : '',
      isWork: t === 0, isSvc: t === 1, isRev: t === 2,
      w: () => this.setState({ tab: 0 }), s: () => this.setState({ tab: 1 }), r: () => this.setState({ tab: 2 }),
      photos: ids.map((id, i) => ({ img: B + id, alt: names[i] }))
    };
  }
}
</script>
