<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<title>KuArte for techs · Design requests</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="scr">
  <div class="top" style="padding-bottom: 8px">
    <a class="ib" href="m22-dashboard.dc.html" aria-label="Back to bookings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <div class="col grow" style="gap: 0"><h1 class="h1">Design requests</h1><span class="cap">Within 5 km · matching your style tags</span></div>
  </div>
  <div style="padding: 0 20px 12px; flex: none">
    <div class="seg"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button class="{{t.cls}}" onClick="{{t.pick}}">{{t.name}}</button></sc-for></div>
  </div>
  <div class="scroll" style="gap: 12px; padding-top: 2px">
    <sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}">
      <div class="col" style="gap: 12px">
        <sc-for list="{{open}}" as="r" hint-placeholder-count="3">
          <a class="card" href="m28-make-offer.dc.html" style="display: flex; gap: 12px; padding: 12px; text-decoration: none">
            <div class="ph" style="width: 88px; height: 88px; border-radius: 12px"><img src="{{r.img}}" alt="Requested design: {{r.title}}"></div>
            <div class="col grow" style="gap: 3px">
              <div class="row between" style="align-items: flex-start"><span class="sm strong">{{r.title}}</span><span class="pill {{r.pill}}">{{r.tag}}</span></div>
              <span class="cap">{{r.detail}}</span>
              <span class="cap">{{r.when}} · {{r.mode}} · {{r.km}}</span>
              <span class="cap" style="margin-top: auto"><b class="strong">{{r.budget}}</b> · {{r.offers}} · {{r.posted}}</span>
            </div>
          </a>
        </sc-for>
        <p class="cap" style="text-align: center">Customer names and addresses appear only after a booking exists.</p>
      </div>
    </sc-if>
    <sc-if value="{{isMine}}" hint-placeholder-val="{{ false }}">
      <div class="col" style="gap: 12px">
        <sc-for list="{{mine}}" as="r" hint-placeholder-count="2">
          <div class="card" style="display: flex; gap: 12px; padding: 12px; align-items: center">
            <div class="ph" style="width: 64px; height: 64px; border-radius: 12px"><img src="{{r.img}}" alt="{{r.title}}"></div>
            <div class="col grow" style="gap: 2px"><span class="sm strong">{{r.title}}</span><span class="cap">Your quote ₱{{r.price}} · {{r.slots}}</span></div>
            <span class="pill {{r.pill}}">{{r.status}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <nav class="nav" aria-label="Tech">
    <a href="m22-dashboard.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bookings</a>
    <a class="on" href="m27-design-requests.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Requests<span class="dot"></span></a>
    <a href="m19-camera.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Portfolio</a>
    <a href="m24-insights.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Insights</a>
    <a href="m17-setup.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 0 }; }
  renderVals() {
    const B = './assets/';
    const t = this.state.tab;
    const KU = window.KU;
    const offer = KU ? KU.get('offer', null) : null;
    const bk = KU ? KU.booking() : null;
    const mine = [
      { title: 'Classic French', img: B + 'photos/soft-french.jpg', price: 350, slots: '2 times offered', status: 'Waiting', pill: 'wait' },
      { title: 'Gold leaf nude', img: B + 'photos/gold-leaf-tips.jpg', price: 420, slots: 'Booked Sat 10:00 AM', status: 'Chosen', pill: 'ok' }
    ];
    if (offer) {
      const chosen = bk && bk.source === 'design';
      const me = chosen && bk.tech === 'viper';
      mine.unshift({ title: 'Noir and gold', img: B + 'photos/black-cherry.jpg', price: offer.price, slots: me ? 'Booked ' + bk.when : offer.slots.join(', '),
        status: me ? 'Chosen' : (chosen ? 'Not chosen' : 'Waiting'), pill: me ? 'ok' : (chosen ? 'bad' : 'wait') });
    }
    return {
      tabs: ['Open · 3', 'My offers · ' + mine.length].map((name, i) => ({ name, cls: t === i ? 'on' : '', pick: () => this.setState({ tab: i }) })),
      isOpen: t === 0, isMine: t === 1, mine,
      open: [
        { title: 'Noir and gold', img: B + 'photos/black-cherry.jpg', detail: 'Gel extensions · Almond, medium', when: 'This weekend', mode: 'Walk-in', km: '1.4 km', budget: '₱400–600', offers: (offer ? 'You offered ₱' + offer.price : '3 offers so far'), posted: '25 min ago', tag: offer ? 'Offered' : 'New', pill: offer ? 'ok' : 'wait' },
        { title: 'Milky dots', img: B + 'photos/milky-dots.jpg', detail: 'Gel manicure · Oval, short', when: 'Next week', mode: 'Home service', km: '2.8 km', budget: 'Up to ₱400', offers: '1 offer so far', posted: '1 hr ago', tag: 'Home', pill: 'info' },
        { title: 'Autumn florals', img: B + 'photos/rose-florals.jpg', detail: 'Acrylic · Coffin, long', when: 'Sat, Nov 7', mode: 'Walk-in', km: '3.5 km', budget: '₱600+', offers: 'No offers yet', posted: '2 hr ago', tag: 'Open', pill: 'ok' }
      ]
    };
  }
}
</script>
</body>
</html>
