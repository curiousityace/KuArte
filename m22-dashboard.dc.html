<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E1720">
<link rel="icon" href="./assets/photos/favicon-64.png" type="image/png">
<title>KuArte for techs · Bookings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kuarte.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Marcellus&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}</style>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<template id="dc-tpl">
<div class="scr">
  <div style="background: #5E1720; color: #FFFFFF; padding: 24px 20px 18px; display: flex; flex-direction: column; gap: 16px; flex: none">
    <div class="row" style="gap: 12px">
      <span class="av" style="background: #FCF8F7; color: #5E1720">VC</span>
      <div class="col grow" style="gap: 0"><span style="font: 600 20px/1.2 'Playfair Display', serif">Good afternoon, Viper</span><span style="font-size: 12px; color: #E9D3D5">Wednesday, Nov 4</span></div>
      <a class="ib" href="m21-request.dc.html" aria-label="Notifications" style="background: rgba(255,255,255,.12); border-color: transparent; color: #FFFFFF; position: relative"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot" style="top: 8px; right: 9px; border-color: #5E1720"></span></a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.1)"><span style="font: 700 22px/1 'DM Sans', system-ui, sans-serif">4</span><p style="font-size: 11px; color: #E9D3D5; margin-top: 4px">today</p></div>
      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.1)"><span style="font: 700 22px/1 'DM Sans', system-ui, sans-serif">{{toAnswer}}</span><p style="font-size: 11px; color: #E9D3D5; margin-top: 4px">to answer</p></div>
      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.1)"><span style="font: 700 22px/1 'DM Sans', system-ui, sans-serif">₱405</span><p style="font-size: 11px; color: #E9D3D5; margin-top: 4px">payout pending</p></div>
    </div>
  </div>
  <div style="padding: 14px 20px 10px; flex: none" class="col">
    <sc-if value="{{hasRequest}}" hint-placeholder-val="{{ true }}">
      <a href="m21-request.dc.html" class="row" style="gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FBEFD9; text-decoration: none">
        <svg class="i s" viewBox="0 0 24 24" aria-hidden="true" style="color: #8A5212"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="sm grow" style="color: #5A3A0E"><b>{{reqName}}</b> wants {{reqWhen}}. Reply within 4 hr.</span>
        <svg class="i s" viewBox="0 0 24 24" aria-hidden="true" style="color: #8A5212"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </sc-if>
    <a href="m27-design-requests.dc.html" class="row" style="gap: 10px; padding: 12px 14px; border-radius: 14px; background: #F6ECED; text-decoration: none; margin-top: 6px">
      <svg class="i s wine" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      <span class="sm grow" style="color: #5E1720"><b>3 design requests</b> near you. Send an offer.</span>
      <svg class="i s wine" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </a>
    <div class="seg" style="margin-top: 6px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button class="{{t.cls}}" onClick="{{t.pick}}">{{t.name}}</button></sc-for>
    </div>
  </div>
  <div class="scroll" style="gap: 10px; padding-top: 2px">
    <sc-for list="{{rows}}" as="b" hint-placeholder-count="4">
      <a class="card" href="{{b.href}}" style="display: flex; gap: 12px; padding: 12px 14px; align-items: center; text-decoration: none">
        <div class="col" style="gap: 0; width: 52px; flex: none"><span class="sm strong">{{b.start}}</span><span class="cap">{{b.end}}</span></div>
        <div style="width: 1px; align-self: stretch; background: #EADFE0"></div>
        <div class="col grow" style="gap: 2px"><span class="sm strong">{{b.name}}</span><span class="cap">{{b.svc}}</span></div>
        <span class="pill {{b.pill}}">{{b.status}}</span>
      </a>
    </sc-for>
  </div>
  <nav class="nav" aria-label="Tech">
    <a class="on" href="m22-dashboard.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bookings</a>
    <a href="m21-request.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Requests<span class="dot"></span></a>
    <a href="m19-camera.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Portfolio</a>
    <a href="m24-insights.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Insights</a>
    <a href="m17-setup.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: null }; }
  renderVals() {
    const T = ['Today', 'Upcoming', 'Past'];
    const KU = window.KU;
    const bk = KU ? KU.booking() : null;
    const mine = bk && bk.tech === 'viper' ? bk : null;
    const short = (n) => { const p = (n || '').split(' '); return p[0] + (p[1] ? ' ' + p[1][0] + '.' : ''); };
    const reqLive = !!(mine && mine.status === 'requested');
    const hasRequest = reqLive || !bk;
    const req = reqLive ? mine : { customer: 'Maria Santos', when: 'Wed, Nov 4 · 2:30 PM', svc: 'Gel extensions + chrome nail art' };
    const split = (w) => w.indexOf(' · ') > -1 ? [w.split(' · ')[0].replace(/^\w+, /, ''), w.split(' · ')[1]] : [w.split(' ')[0], w.split(' ').slice(1).join(' ')];
    const ST = { accepted: ['Waiting for customer', 'wait'], confirmed: ['Confirmed', 'ok'], cancelled: ['Cancelled', 'bad'] };
    const showRow = !!(mine && ST[mine.status]);
    const tab = this.state.tab == null ? (showRow ? 1 : 0) : this.state.tab;
    const D = [
      [
        { start: '10:00', end: '11:30', name: 'Aria M.', svc: 'Gel extensions · Walk-in', status: 'Completed', pill: 'ok', href: 'm23-complete.dc.html' },
        { start: '1:00', end: '3:00', name: 'Nicole S.', svc: 'Acrylic set · Walk-in', status: 'Checked in', pill: 'info', href: 'm23-complete.dc.html' },
        { start: '3:15', end: '4:15', name: 'Ruby Y.', svc: 'Gel manicure · Walk-in', status: 'Deposit paid', pill: 'ok', href: 'm23-complete.dc.html' },
        { start: '5:30', end: '7:00', name: 'Jessa R.', svc: 'Nail art · Home service', status: 'No deposit', pill: 'wait', href: 'm23-complete.dc.html' }
      ],
      [
        { start: 'Nov 5', end: '10:00', name: 'Lea D.', svc: 'Gel extensions · Walk-in', status: 'Deposit paid', pill: 'ok', href: 'm21-request.dc.html' },
        { start: 'Nov 6', end: '2:00', name: 'Carla P.', svc: 'Acrylic set · Home', status: 'Deposit paid', pill: 'ok', href: 'm21-request.dc.html' }
      ],
      [
        { start: 'Nov 3', end: '4:00', name: 'Joy T.', svc: 'Gel manicure', status: 'Reviewed 5.0', pill: 'ok', href: 'm24-insights.dc.html' },
        { start: 'Nov 2', end: '11:00', name: 'Ana B.', svc: 'Nail art', status: 'Cancelled', pill: 'bad', href: 'm24-insights.dc.html' }
      ]
    ];
    return {
      tabs: T.map((n, i) => ({ name: n, cls: tab === i ? 'on' : '', pick: () => this.setState({ tab: i }) })),
      rows: tab === 1 && showRow ? [{ start: split(mine.when)[0], end: split(mine.when)[1], name: short(mine.customer), svc: (mine.source === 'design' ? 'Design offer · ' : '') + mine.svc.split(' + ')[0] + ' · ' + mine.mode, status: ST[mine.status][0], pill: ST[mine.status][1], href: mine.source === 'design' ? 'm27-design-requests.dc.html' : 'm21-request.dc.html' }].concat(D[1]) : D[tab],
      hasRequest, toAnswer: hasRequest ? 1 : 0, reqName: short(req.customer), reqWhen: req.when
    };
  }
}
</script>
</body>
</html>
